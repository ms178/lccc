# Reproducible LCCC research toolchain.
#
# Rust 1.98.0 is the session/compiler-build baseline. `rustup` resolves this
# file automatically; the Arena restore script provisions the same channel in
# the persisted /home/user/.rustup and /home/user/.cargo trees.
[toolchain]
channel = "1.98.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
