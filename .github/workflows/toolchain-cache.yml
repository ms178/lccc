# TEMPORARY transport workflow (will be removed from the branch once used).
#
# The current Arena sandbox can only reach github.com/api.github.com/codeload,
# registry.npmjs.org and pypi.org — static.rust-lang.org is TLS-blocked, so no
# Rust toolchain can be installed directly. GitHub-hosted runners have full
# internet, so this job downloads the official stable dist tarballs, splits
# them into <95 MB git blobs, and pushes them as an ORPHAN TAG (no branch is
# created or modified). The sandbox then fetches the tag over plain git,
# reassembles and sha256-verifies the tarballs, and deletes the tag.
name: toolchain-cache
on:
  workflow_dispatch: {}
  push:
    branches: ["arena/ff2b91ca-lccc"]
    paths: [".github/workflows/toolchain-cache.yml"]
permissions:
  contents: write
concurrency:
  group: toolchain-cache
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - name: Download official Rust 1.97.0 components
        run: |
          set -euxo pipefail
          mkdir -p work/chunks && cd work
          base=https://static.rust-lang.org/dist
          for c in rustc-1.97.0-x86_64-unknown-linux-gnu \
                   rust-std-1.97.0-x86_64-unknown-linux-gnu \
                   cargo-1.97.0-x86_64-unknown-linux-gnu \
                   clippy-1.97.0-x86_64-unknown-linux-gnu \
                   rustfmt-1.97.0-x86_64-unknown-linux-gnu; do
            curl -sSf --retry 3 -O "$base/$c.tar.xz"
          done
          sha256sum *.tar.xz > chunks/MANIFEST.sha256
          for f in *.tar.xz; do
            split -b 94371840 -d -a 2 "$f" "chunks/$f.part"
          done
          ls -l chunks/
      - name: Push chunks as orphan tag rust-cache-1.97.0
        run: |
          set -euxo pipefail
          cd work/chunks
          git init -q .
          git config user.name  'toolchain-cache'
          git config user.email 'toolchain-cache@local'
          git add -A
          git commit -q -m 'rust 1.97.0 x86_64-unknown-linux-gnu dist chunks (transport only)'
          git tag rust-cache-1.97.0
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            refs/tags/rust-cache-1.97.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
