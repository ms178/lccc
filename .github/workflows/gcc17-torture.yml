name: GCC 17 C torture (x86)

# Full gcc.c-torture/{execute,compile} campaign against a revision-pinned GCC
# 17-git trunk checkout, for both x86 targets. Deliberately NOT part of the
# pull-request critical path: a full corpus is minutes of wall clock, so it runs
# manually, weekly, and on main-branch changes to the compiler or to the harness
# that drives it -- the inputs whose breakage it can detect and a PR cannot
# afford to wait for.
#
# Two EXPLICIT jobs rather than a `strategy.matrix`: scripts/check_ci_gate_parity.py
# models a hosted workflow as a job DAG and rejects any job carrying a `strategy`
# block, so a matrix here would permanently fail a mandatory fast gate on every
# PR. Each job instead calls the one leg definition in `gcc17-torture-leg.yml`,
# the same reusable-workflow convention ci.yml uses for bench.yml -- the legs
# cannot drift, and the arch-specific values exist exactly once.

on:
  workflow_dispatch:
    inputs:
      flags:
        description: 'Comma-separated optimization configurations (default: -O2)'
        required: false
        default: '-O2'
      filter:
        description: 'Regular expression over test basenames (empty: whole corpus)'
        required: false
        default: ''
      ref:
        description: 'GCC trunk commit to pin (empty: resolve current master)'
        required: false
        default: ''
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [main]
    # Every input whose change can alter this lane's verdict. `tests/**` matters
    # because the corpus runner and its contract tests live there; the
    # provisioning scripts matter because a broken gcc-16 install surfaces here
    # first. Without them a breakage lands on main unobserved until the next cron.
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'scripts/ci_gcc17_torture.sh'
      - 'scripts/ensure_gcc_torture_git.py'
      - 'scripts/x86_gcc_torture.py'
      - 'scripts/x86_gcc_torture_i686.py'
      - 'scripts/build_lccc_fast.sh'
      - 'scripts/ci_install_gcc16.sh'
      - 'scripts/ci_provision_toolchain.sh'
      - 'scripts/ci_verify_oracles.sh'
      - 'scripts/ci_enable_swap.sh'
      - '.github/workflows/gcc17-torture.yml'
      - '.github/workflows/gcc17-torture-leg.yml'

permissions:
  contents: read

concurrency:
  group: gcc17-torture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build fastbuild compiler artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_FASTBUILD_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Enable temporary CI swap
        run: bash scripts/ci_enable_swap.sh
      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache Cargo git dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
      - name: Build LCCC (fastbuild, -O1, two jobs)
        run: bash scripts/build_lccc_fast.sh
      - name: Record and package compiler artifacts
        run: |
          set -euo pipefail
          git rev-parse HEAD > target/fastbuild/ci-build.commit
          sha256sum target/fastbuild/lccc target/fastbuild/lccc-x86 \
            target/fastbuild/lccc-arm target/fastbuild/lccc-riscv \
            target/fastbuild/lccc-i686 target/fastbuild/lccc-ld \
            > target/fastbuild/ci-build.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: lccc-fast-${{ github.sha }}
          path: |
            target/fastbuild/lccc
            target/fastbuild/lccc-x86
            target/fastbuild/lccc-arm
            target/fastbuild/lccc-riscv
            target/fastbuild/lccc-i686
            target/fastbuild/lccc-ld
            target/fastbuild/ci-build.commit
            target/fastbuild/ci-build.sha256
          if-no-files-found: error
          retention-days: 2

  torture-x86_64:
    name: GCC 17 torture — x86_64
    needs: [build]
    uses: ./.github/workflows/gcc17-torture-leg.yml
    with:
      arch: x86_64
      flags: ${{ inputs.flags || '-O2' }}
      filter: ${{ inputs.filter || '' }}
      ref: ${{ inputs.ref || '' }}

  torture-i686:
    name: GCC 17 torture — i686
    needs: [build]
    uses: ./.github/workflows/gcc17-torture-leg.yml
    with:
      arch: i686
      flags: ${{ inputs.flags || '-O2' }}
      filter: ${{ inputs.filter || '' }}
      ref: ${{ inputs.ref || '' }}
