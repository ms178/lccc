# TEMPORARY transport workflow (removed from the branch once consumed).
# Third payload: statically linked qemu user-mode emulators for the
# cross-target execution gates (deb.debian.org is TLS-blocked from the
# sandbox). Pushed as orphan tag harness-cache-3.
name: harness-cache3
on:
  workflow_dispatch: {}
  push:
    branches: ["arena/ff2b91ca-lccc"]
    paths: [".github/workflows/harness-cache3.yml"]
permissions:
  contents: write
concurrency:
  group: harness-cache3
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch qemu-user-static
        run: |
          set -euxo pipefail
          mkdir -p payload && cd payload
          apt-get download qemu-user-static
          dpkg-deb -x qemu-user-static_*.deb extract
          for a in aarch64 riscv64 i386 arm; do
            cp "extract/usr/bin/qemu-${a}-static" "qemu-${a}"
          done
          rm -rf extract qemu-user-static_*.deb
          for a in aarch64 riscv64 i386 arm; do
            xz -9 -T2 "qemu-${a}"
            # git-over-HTTP push limit is ~100MB/blob; split defensively.
            split -b 45m -d "qemu-${a}.xz" "qemu-${a}.xz.part"
            rm "qemu-${a}.xz"
          done
          sha256sum qemu-* > MANIFEST.sha256
          ls -l .
      - name: Push as orphan tag harness-cache-3
        run: |
          set -euxo pipefail
          cd payload
          git init -q .
          git config user.name 'harness-cache'
          git config user.email 'harness-cache@local'
          git add -A
          git commit -q -m 'qemu user-mode emulators (transport only)'
          git tag harness-cache-3
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            refs/tags/harness-cache-3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
