name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  benchmark:
    name: LCCC vs GCC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache downloaded dependencies, not `target/`: benchmark results must
      # come from a compiler rebuilt from the checked-out source, never a
      # binary restored from an unrelated revision with the same lockfile.
      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-bench-deps-${{ hashFiles('**/Cargo.lock') }}

      - name: Build LCCC
        run: ./scripts/build_lccc_o1_j2.sh

      - name: Detect GCC include path
        id: gcc
        run: |
          GCC_INC="$(gcc -print-file-name=include)"
          echo "inc=$GCC_INC" >> "$GITHUB_OUTPUT"
          echo "GCC include: $GCC_INC"
          gcc --version | head -1

      - name: Verify Fibonacci rec2iter optimization
        env:
          GCC_INC: ${{ steps.gcc.outputs.inc }}
        run: |
          echo "Compiling rec2iter correctness test..."
          target/release/lccc -I"$GCC_INC" -O2 -o /tmp/fib_rec2iter tests/fib_rec2iter.c
          echo "Running (includes fib(90) — impossible without rec2iter)..."
          /tmp/fib_rec2iter

      - name: Run complete benchmark corpus
        run: |
          # GitHub's default Linux shell for `run:` steps is `bash -e`
          # WITHOUT pipefail: a failing left-hand side of a pipeline is
          # masked by `tee`'s success.  ci-bench.py --strict is a GATE
          # (compile failure, runtime failure, output mismatch, missing
          # compiler), so the pipe must propagate it — same contract as
          # the regression gate in ci.yml.
          set -o pipefail
          # ci-bench.py delegates to tests/benchmark/run_benchmarks.py. With
          # no --only selection this is the complete checked-in corpus:
          # synthetic kernels plus every pinned workload-derived kernel.
          python3 .github/scripts/ci-bench.py \
            --lccc target/release/lccc \
            --compilers lccc,gcc \
            --reps 9 \
            --warmup 1 \
            --artifact-dir bench-artifacts \
            --json bench-results.json \
            --markdown bench-summary.md \
            --strict | tee bench-terminal.txt

      - name: Post benchmark summary
        if: always()
        run: cat bench-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # MS-01a codegen-quality gate. The runtime gate above can only catch
      # what the timed benchmarks measure; this one pins static, noise-free
      # codegen metrics (insns / stackmem / pushes / ymm / fma) for the six
      # golden workloads against .github/scripts/ci-codegen-baseline.json
      # with per-workload tolerance bands. It was written for bench.yml but
      # never wired (the v3 audit found it orphaned — the workflow only ran
      # ci-bench.py); wiring it now closes the "runtime-only gate" hole the
      # audit flagged. Baseline refreshes go through --update-baseline in
      # the PR that lands the improvement, per the gate's header contract.
      - name: Codegen quality gate (golden workloads)
        run: |
          set -o pipefail
          python3 .github/scripts/ci-codegen-gate.py \
            --lccc target/release/lccc 2>&1 | tee codegen-gate.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            bench-results.json
            bench-summary.md
            bench-terminal.txt
            bench-artifacts/
            codegen-gate.txt
