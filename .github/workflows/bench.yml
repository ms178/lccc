name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  benchmark:
    name: LCCC vs GCC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache downloaded dependencies, not `target/`: benchmark results must
      # come from a compiler rebuilt from the checked-out source, never a
      # binary restored from an unrelated revision with the same lockfile.
      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-bench-deps-${{ hashFiles('**/Cargo.lock') }}

      - name: Build LCCC
        run: ./scripts/build_lccc_o1_j2.sh

      - name: Detect GCC include path
        id: gcc
        run: |
          GCC_INC="$(gcc -print-file-name=include)"
          echo "inc=$GCC_INC" >> "$GITHUB_OUTPUT"
          echo "GCC include: $GCC_INC"
          gcc --version | head -1

      - name: Verify Fibonacci rec2iter optimization
        env:
          GCC_INC: ${{ steps.gcc.outputs.inc }}
        run: |
          echo "Compiling rec2iter correctness test..."
          target/release/lccc -I"$GCC_INC" -O2 -o /tmp/fib_rec2iter tests/fib_rec2iter.c
          echo "Running (includes fib(90) — impossible without rec2iter)..."
          /tmp/fib_rec2iter

      - name: Run complete benchmark corpus
        run: |
          # ci-bench.py delegates to tests/benchmark/run_benchmarks.py. With
          # no --only selection this is the complete checked-in corpus:
          # synthetic kernels plus every pinned workload-derived kernel.
          python3 .github/scripts/ci-bench.py \
            --lccc target/release/lccc \
            --compilers lccc,gcc \
            --reps 9 \
            --warmup 1 \
            --artifact-dir bench-artifacts \
            --json bench-results.json \
            --markdown bench-summary.md \
            --strict | tee bench-terminal.txt

      - name: Post benchmark summary
        if: always()
        run: cat bench-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            bench-results.json
            bench-summary.md
            bench-terminal.txt
            bench-artifacts/
