        [ -s "$RUNNER_TEMP/void-declarators.log" ] || exit 0
        python3 scripts/ci_annotate_log.py --title "void declarators" "$RUNNER_TEMP/void-declarators.log"
    - name: File-scope constant initializers
      run: env CCC=target/fastbuild/lccc GCC=gcc-16 bash tests/regression/check_file_scope_init.sh
    - name: Const-object read folding
      run: env CCC=target/fastbuild/lccc bash tests/regression/check_const_object_fold.sh
