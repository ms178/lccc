name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The regression corpus includes executable i686 cases.  ubuntu-latest
      # can provide /lib/ld-linux.so.2 without the 32-bit development/startup
      # objects that LCCC's linker needs; in that partial environment those
      # binaries link but enter libc with a malformed startup image and die
      # with SIGSEGV.  Install the complete multilib contract before building
      # so the i686 tests exercise compiler codegen rather than host setup.
      - name: Install i686 C runtime and development files
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib g++-multilib libc6-dev-i386

      # The differential oracle set must be EXPLICIT, not whatever the runner
      # image happens to ship: a gate whose evidence depends on the image is a
      # gate that silently changes strength between runs.  `lld` is required
      # in addition to `bfd` because it is the oracle that implements linker
      # scripts -- mold accepts -T but its parser rejects even a minimal
      # SECTIONS, so with mold alone every script-path relocation cross-check
      # had a single opinion, which is not a cross-check.  The suite probes
      # script capability structurally per oracle, so this stays honest even
      # on a host where one of them is missing.
      - name: Install differential linker oracles
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold lld

      # The record-tag identity gate diffs against a real compiler, and it needs
      # one that understands -std=c23. ubuntu-latest ships GCC 13, which does
      # not: it rejects the FLAG, and because a rejection of the flag and a
      # rejection of the program both look like "reject", five negative rows
      # then "agreed" with lccc and one positive row went red. That is PR #737,
      # and the red was the gate's fault, not the compiler's. Per the doctrine
      # stated above, the oracle set is provisioned explicitly rather than left
      # to the image. The gate independently probes for a compiler that accepts
      # both -std=c17 and -std=c23, refuses to run without one, runs a positive
      # control per dialect before any row, requires every rejection to be for
      # the stated reason, and prints the oracle's --version in its summary --
      # so this step is what makes the oracle deterministic, and the gate is
      # what makes a missing one loud instead of vacuous.
      - name: Install a C23-capable GCC oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-14

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      # Do not cache `target/` across commits.  A source-independent target
      # cache can leave a release compiler from a prior revision beside fresh
      # sources, making the regression gate test the wrong binary. Registry
      # and git dependency caches above retain the useful network speed-up;
      # the compiler executable is deliberately rebuilt from this checkout.

      # Before anything that executes a script. A merge conflict committed
      # into a shell script is a syntax error only when the shell REACHES the
      # line, so every gate above the damage still reports PASS for a suite
      # that never ran -- a green run that tested nothing.
      - name: No merge conflict markers
        run: python3 scripts/check_no_conflict_markers.py

      - name: Verify manifest Rust-toolchain selection
        run: bash tests/regression/check_rust_toolchain_selector.sh

      - name: Verify restored linker oracle versions
        run: bash tests/regression/check_linker_oracle_versions.sh

      # Keep CI on the documented compiler build policy: fastbuild, Rust -O1
      # and two jobs. This is deliberately not Cargo's default release -O3.
      - name: Build
        run: ./scripts/build_lccc_fast.sh

      - name: Audit loop branch and must-execute contracts
        run: env CCC=target/fastbuild/lccc bash tests/regression/check_audit_loop_contracts.sh

      - name: IVSR integer-domain contracts
        run: env CCC=target/fastbuild/lccc bash tests/regression/check_ivsr_domains.sh

      - name: Scalar lane types, stack boundaries and opt-in homes
        run: env CCC=target/fastbuild/lccc bash tests/regression/check_fp_extract_homes.sh

      - name: Variadic pack count inlining contracts
        run: env CCC=target/fastbuild/lccc bash tests/regression/check_va_arg_pack_len.sh

      - name: Run tests
        env:
          CARGO_BUILD_JOBS: "2"
          RUSTFLAGS: -D warnings
        # Keep every Rust compilation that produces LCCC code at the project
        # fastbuild policy: opt-level 1 and no more than two Cargo jobs.
        run: cargo test --profile fastbuild --all-targets --locked -j 2

      # The fastbuild profile inherits `release`, which compiles every
      # debug_assert! OUT - and with them the mechanical enforcement this
      # repo's correctness story rests on: the %rax shadow-epoch validator
      # (`CodegenState::acc_has_verified`), the GVN span-lockstep check, and
      # every other debug-only invariant. That is how the GVN drained-Vec
      # bug survived the suite until someone remembered to run
      # `-C debug-assertions` locally (see its fix commit). This second
      # invocation re-runs the whole suite with debug-assertions forced ON
      # via Cargo's profile env-override (no Cargo.toml change, so the
      # shipped fastbuild build stays assertion-free). The dual-layout
      # exploratory emission and the epoch validator make this run ~1.3x
      # the wall clock of the step above; it is the only place CI can
      # observe the debug-only contract, so the cost is the point.
      - name: Run tests (debug-assertions on)
        env:
          CARGO_BUILD_JOBS: "2"
          RUSTFLAGS: -D warnings
        run: >-
          cargo test --profile fastbuild --all-targets --locked -j 2
          --config 'profile.fastbuild.debug-assertions=true'
          --config 'profile.fastbuild.incremental=false'
          --config 'profile.fastbuild.debug=0'

      # Record the exact host/toolchain contract beside the regression JSON.
      # Hosted runners vary their GCC/binutils versions and exposed CPU flags;
      # a failing native-code test is not diagnosable from an exit status alone.
      - name: Record regression environment
        run: |
          {
            echo '== system =='
            uname -a
            cat /etc/os-release || true
            echo '== locale =='
            locale || true
            echo '== Rust =='
            rustc -Vv
            cargo --version
            echo '== C toolchain =='
            gcc --version | head -1
            as --version | head -1
            ld --version | head -1
            dpkg-query -W -f='${Package} ${Version}\n' gcc-multilib libc6-dev-i386 2>/dev/null || true
            echo '== CPU flags =='
            grep -m1 -E '^flags[[:space:]]*:' /proc/cpuinfo || true
            echo '== tested compiler =='
            sha256sum target/fastbuild/lccc target/fastbuild/lccc-ld
          } | tee ci-regression-environment.txt

      # This is deliberately a bounded-parallel full corpus rather than a
      # hand-picked smoke: the SSA validator catches stale value watermarks
      # and duplicate definitions only after real optimization/codegen paths.
      # Two workers keep the release compiler and simultaneous linker jobs
      # within GitHub's standard runner memory envelope.
      - name: Run regression corpus with SSA validation
        env:
          CCC_VALIDATE_SSA: "1"
        run: |
          set -o pipefail
          python3 tests/regression/run_regression.py \
            --lccc target/fastbuild/lccc \
            -j 2 \
            --json regression-results.json 2>&1 | tee regression-results.log

      # Correctness gate over the benchmark corpus (INF-BENCHGATE-1): the
      # workload-derived kernels are the largest programs in the tree and
      # exercise loop shapes the regression corpus does not. An IV-widening
      # miscompile once passed all 563 regression tests and only this
      # compile-run-diff oracle (no timing, ~minutes) caught it. Compare
      # every kernel against GCC at -O0/-O1/-O2/-O3: a level-specific
      # miscompile is still a miscompile.
      - name: Benchmark output gate (workload kernels vs GCC oracle)
        run: bash scripts/check_benchmark_outputs.sh

      # Differential correctness gate (vectorizer + codegen vs GCC oracle):
      # the casefile that caught the `v<0 ? 0-(v+1) : v` abs-fold
      # miscompile AFTER it had passed the regression corpus, cargo test,
      # and the benchmark-output gate. Each case compiles under lccc and
      # GCC at aggressive vectorization flags and diffs stdout: a level-
      # or flag-specific miscompile is still a miscompile.
      - name: Differential correctness gate (lccc vs GCC oracle)
        run: LCCC_BIN=target/fastbuild/lccc python3 tests/correctness/run_correctness.py

      # Emitted-assembly contract for the hot-loop alignment policy: every
      # vector loop carries the bounded `.p2align 5,,15` + `.p2align 4`
      # cascade, every scalar loop the `.p2align 4,,10` + `.p2align 3`
      # cascade, and constant-trip-<=4 loops (`<`, `<=`, `!=`, mirrored)
      # reach codegen AND stay unpadded. Asserts both directions, so a
      # missing tier fails and so does an unexpected one.
      - name: Loop-alignment contract gate (emitted assembly)
        run: python3 scripts/check_loop_alignment.py --lccc target/fastbuild/lccc

      # Nested same-tag record identity, differential against the host GCC.
      # The runtime corpus cannot cover this: GCC rejects the offending program
      # so there is no output to compare. TAG-ID-1 shipped as a miscompile with
      # every corpus and unit test green, which is why it gets its own oracle.
      - name: Record tag identity gate (nested same-tag structs)
        run: env CCC=target/fastbuild/lccc bash tests/regression/check_record_tag_identity.sh

      # The result artifact is retained already, but GitHub's public job view
      # hides raw logs/artifacts from anonymous triage. Turn each result into a
      # normal check annotation so the failing test and phase stay visible.
      - name: Surface regression failures in annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("regression-results.json")
          if not path.is_file():
              print("::error title=Regression harness::no regression-results.json was written")
          else:
              report = json.loads(path.read_text(encoding="utf-8"))
              failures = report.get("failures", [])
              if not failures:
                  print("::error title=Regression harness::runner failed before reporting a test result")
              for failure in failures:
                  name = failure.get("name", "unknown")
                  phases = ", ".join(failure.get("phases", [])) or "no phase"
                  detail = " ".join(str(failure.get("detail", "")).split())
                  detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Regression {name} ({phases})::{detail[:1500]}")
          PY

      # The ordinary C regression proves the inline asm executes.  This
      # byte-level gate additionally rejects the historical UTF-8-to-Latin-1
      # recoding in the emitted #APP region, including an adjacent-literal
      # multibyte sequence split.
      # Wiring guard for the unified differential-testing harness: every
      # advertised engine must be a real implementation.  This exists because
      # the csmith/yarpgen engines once regressed to silent no-op stubs that
      # reported TOTAL: 0 with exit status 0 — a validation vacuum.
      # ── observable-access (volatile) contract ────────────────────────────
      # A `volatile` access is an observable side effect (C11 5.1.2.3): it
      # must execute exactly as written, once per written occurrence.  These
      # three steps are the instruments for that contract, and each was
      # mutation-verified by reintroducing a deleted guard in
      # src/passes/licm.rs:
      #
      #   * volatile-destructuring is STATIC and costs no build.  It fails when
      #     a `volatile` destructured from an IR access is bound and never
      #     used.  This is the failure mode the build cannot catch: src/lib.rs
      #     allows `unused_variables` crate-wide, so a guard dropped in a
      #     refactor leaves no diagnostic and `cargo clippy -- -D warnings`
      #     stays green.  Its --self-test runs the detector over the known-bad
      #     shape first, because a detector nobody has seen fire is not a
      #     detector.
      - name: Volatile destructuring ratchet
        run: |
          python3 scripts/check_volatile_destructuring.py --self-test
          python3 scripts/check_volatile_destructuring.py

      #   * The two behavioural gates read the emitted assembly.  The
      #     spin-loop one is the only instrument here that catches a HOIST:
      #     hoisting leaves the access count at one, so the subscript gate
      #     stays green on a miscompiled MMIO poll loop (measured, not
      #     assumed).  Both pair every volatile probe with a non-volatile
      #     control that MUST be hoisted, so a green run means the two cases
      #     were actually distinguished.
      - name: Volatile spin-loop position gate
        run: bash tests/regression/check_volatile_spin_loop.sh

      # The 64-bit division width bypass is a *tuning* decision, so it has two
      # silent failure modes the C fixture cannot see: the guard missing on a row
      # whose measured divider ratio says it is worth it (the fixture still
      # passes — `divq` is just the old, slower path), and the guard present where
      # it must not be (a row, or `CCC_NO_DIV64_BYPASS=1`, that must stay
      # byte-identical to the pre-bypass compiler).  This gate asserts the emitted
      # text for all three probes and executes the guarded form against GCC on
      # both sides of the 2^32 boundary.
      - name: 64-bit divide bypass assembly contract
        run: bash tests/regression/check_div64_bypass_asm.sh

      # A volatile BITFIELD is a read-modify-write, sometimes straddling two
      # storage units, so none of the gates above can see it: they inspect
      # straight-line accesses.  Every access of every one of those RMWs used to
      # be emitted non-volatile, which at -O2 collapsed a loop of N volatile
      # stores into a single store -- a wrong answer, not a lost optimisation.
      # Non-volatile twins in the same fixture are the control.
      - name: Volatile bitfield lowering gate
        run: bash tests/regression/check_volatile_bitfield_split.sh

      # A gate must not report a FAILURE that did not happen.  Under `set -o
      # pipefail` a consumer that stops reading early (`head`, `grep -q`) kills
      # its producer with SIGPIPE and the pipeline reports 141, so the negative
      # branch runs although the pattern matched -- measured at 27-153 false
      # failures per 20000 checks, and reproduced on a gate that failed about
      # one run in three while the compiler emitted byte-identical output 400
      # consecutive times.  Strict over every script CI runs.
      - name: Pipefail/SIGPIPE detector
        run: |
          python3 scripts/check_pipefail_sigpipe.py --self-test
          python3 scripts/check_pipefail_sigpipe.py

      # `check_volatile_pointer_subscript.sh` and `check_loop_preheader.sh`
      # are NOT repeated here. Both used to exist as standalone steps AND
      # inside the "Verify remaining fast local contracts" block below, so
      # each ran twice -- and the standalone copy ran with no `CCC` exported,
      # i.e. against whatever the gate's own default resolves to, which is a
      # strictly weaker check than the one that actually has a binary in
      # hand. They now run exactly once, in the block that sets CCC.

      - name: Fuzz harness verdict tests
        run: python3 -m unittest discover -s tests/fuzz -p 'test_*.py'

      - name: Verify differential-fuzz engine wiring
        run: python3 scripts/fuzz_diff.py --check-engines

      # Dependency-free differential smoke: a handful of synthetic programs
      # compiled with LCCC and the host GCC across -O0/-O2 must agree.  This
      # is the shortest end-to-end proof that the harness, the freshly built
      # compiler, and the reference oracle all actually execute.  The seed is
      # pinned so a failure is always reproducible locally.
      - name: Differential fuzz smoke (synthetic)
        run: |
          python3 scripts/fuzz_diff.py --engine synthetic --count 4 \
            --lccc target/fastbuild/lccc --refs gcc --opts=-O0,-O2 \
            --seed 20260906

      - name: Verify inline-asm UTF-8 assembly text
        run: |
          python3 scripts/check_inline_asm_utf8.py \
            --lccc target/fastbuild/lccc \
            --expect preserved \
            --json inline-asm-utf8.json

      # PERF-41 has a structural codegen oracle in addition to the runtime
      # differential test above. Keep it in CI so a later emitter change
      # cannot silently replace packed reciprocal/product work with four
      # scalar divisions, or reassociate the ordered accumulator.
      - name: Verify strict computed-reciprocal codegen
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_strict_computed_recip_codegen.sh

      # The narrow-slot promotion is both a correctness invariant and a
      # compile-time quality gate: wide relays of 32-bit spills must not
      # silently replay whole MachInst windows through the classic emitter.
      - name: Verify MachInst narrow-slot window allocation
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_machinst_window_alloc_wide_copy.sh

      - name: Verify over-aligned alloca typed-census admission
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_overalign_typed_census.sh

      # Unwind tables are derived from the final (post-peephole) code, so the
      # peephole must see identical input with and without them, and the
      # integrated assembler must turn the CFI into a real .eh_frame:
      # backtrace() and pthread_exit()/pthread_cancel() cleanups through
      # lccc frames, lccc-ld's .eh_frame_hdr after --gc-sections/COMDAT.
      - name: Verify peephole parity with and without unwind tables
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_nocfi_peephole_parity.sh

      - name: Verify unwinding through lccc frames (.eh_frame)
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_eh_frame_unwind.sh

      - name: Verify synthesized CFI invariants (corpus, x86-64 + i686)
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_cfi_invariants.sh

      # ARX lane vectorizers: lane frames chosen for the round loop's
      # critical path (scripts/loop_latency.py), plus RFC 7539 / GCC checksums.
      - name: Verify ARX lane-frame latency (vec_arx + arx_vectorize)
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_arx_frame_latency.sh

      # Latency-driven reassociation (reassoc_lat): SHA-256 round recurrence
      # at the 5/6-cycle floor with a same-run negative control, plus a
      # GCC-differential of signed/unsigned Add/Xor/And/Or loop trees.
      - name: Verify latency-driven reassociation (reassoc_lat)
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_reassoc_latency.sh

      - name: Verify COMDAT groups are identified by signature (x86-64 + i686 links)
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_comdat_signature_identity.sh

      # Segment-qualified declarator contract: a `__seg_fs`/`__seg_gs`
      # qualifier before a nested type-name's base must reach that
      # type-name's own `*` (cast `(__seg_fs unsigned long *)40` — the
      # PR #497 CI regression: the matrix test SIGSEGV'd on an absolute
      # load of address 40), while a `*` inside a `__typeof__` argument
      # must not steal the ENCLOSING declaration's pending qualifier
      # (the kernel's `extern __seg_gs __typeof__(struct irq_stack *) p;`
      # per-CPU shape). Keep it in CI so a later parser change cannot
      # silently re-drop either direction.
      - name: Verify segment-qualified declarator codegen
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_segfs_typeof_nosteal.sh

      # BB-SLP red-team battery: the 2026-09-16 semantic audit closed three
      # P0 soundness holes (dangling lane uses via Call/Phi/InlineAsm/
      # atomics; the store->load forwarding hazard; cross-seed reordering
      # across an emitted vector store). Runtime + per-function codegen
      # contracts: hazards MUST stay scalar (GCC miscompiles the shifted-
      # alias shape), disjoint-range/restrict shapes MUST vectorize.
      - name: Verify basic-block SLP soundness contracts
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_bb_slp_codegen.sh

      # BB-SLP v3: constant-lane materialization contracts — FP gather
      # lanes must stage through their bit pattern (the old path zeroed
      # them), all-same constant store seeds (q[0..3]=0) must vectorize
      # (root-Splat scheduling), all-ones splats must use the pcmpeqd
      # self-compare, FP const splats must broadcast from the pool.
      - name: Verify basic-block SLP v3 constant-lane contracts
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_bb_slp_v3_codegen.sh

      # BB-SLP v4: affine window addressing (Add(x,x)/Shl/Mul/Sub/Cast
      # offset recognition), rule-(d) disjointness escape, five lane-extract
      # families, and the review follow-ups (VLFOLD I16x16, broadcast-home
      # word bitwise, one-instruction zero/ones halfword splats).
      - name: Verify basic-block SLP v4 contracts
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_bb_slp_v4_codegen.sh

      # BB-SLP v5: packed shift families (both widths), rotate
      # decomposition in both spellings with the shared-operand contract,
      # Not/Neg composites, the Sub(x,1) all-ones idiom, the FP strict
      # min/max fold, and the adversarial rejections.
      - name: Verify basic-block SLP v5 contracts
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_bb_slp_v5_codegen.sh

      # BB-SLP v7: red-team adversarial edges of the v6 feature set
      # (cross-block corners, cmp+blendv corner predicates, FP-Neg
      # chains, memfold width/order corners) plus the sub-word SELECT
      # demotion (C integer promotion: i8/i16/u8/u16 selects and min/max
      # pack at the lane width with predicate remapping) — tri-config
      # differential (SLP on / CCC_NO_BB_SLP=1 / gcc) included.
      - name: Verify basic-block SLP v7 contracts
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_bb_slp_v7_codegen.sh

      # BB-SLP v8: struct-field stream composition, field-disjointness
      # theorem, same-source splats, Forward packs, packed FMA
      # contraction (rounding parity), gap-FMA Sub extension — tri-config
      # differential plus the SSE2-baseline fail-closed run.
      - name: Verify basic-block SLP v8 contracts
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_bb_slp_v8_codegen.sh

      # Nested-diamond if-conversion + sub-word SELECT demotion: the
      # dominating-load coverage walk, single-entry single-exit arm
      # regions, recursive promoted-select demotion and Copy transparency.
      # Enforces the branch-free + vectorized contracts of the whole
      # conditional-clamp family and the must-branch negative controls
      # (uncovered load, free-barrier deref, side-effect/volatile arms,
      # half-covered store), plus the tri-config runtime differential.
      - name: Verify nested if-conversion + sub-word SELECT demotion contracts
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_bb_slp_nested_ifconv.sh

      # Two-block partial unroller + half-wide dword-pair SLP family:
      # guard-free xk unroll of two-block counted loops (phi threading
      # incl. the IV-reference carried-phi miscompile class), I32/U32
      # pair load/store/pack, MemLoad stream CSE, SIB addressing, VEX
      # in-place forms, the immediate-source load fold, and the loop-vec
      # Max/conditional-sum gates — tri-config + kill-switch + SSE2
      # differentials and the asm contracts.
      - name: Verify two-block unroll red-team contracts
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_two_block_unroll_redteam.sh

      # Adler-32 loop epic: the rolling-checksum reassociation
      # (vpsadbw + vpmaddubsw weights + vpmaddwd, exact mod 2^32) that
      # GCC/Clang/ICX all leave scalar, plus the counting-epic
      # miscompile fixes (multi-accumulator decline, IV live-out
      # materialisation, narrow-compare constant wrap) and the asm
      # homing contracts. Tri-config differential (epic on /
      # -mno-avx2 / gcc) included.
      - name: Verify Adler-32 epic contracts
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_vec_adler_epic.sh

      # x86 SIMD ISA contract of the middle end: every vectorization
      # entry that runs BEFORE the main vectorizer's gate must carry
      # its own -mno-sse refusal (the const-trip map path and the
      # memory-form ARX vectorizer both left XMM intrinsics in kernel
      # TUs otherwise), -mno-avx downgrades to 128-bit instead of
      # disabling, and the FMA3 fold only fires when the backend can
      # emit vfmadd. Emission AND executed semantics are pinned.
      - name: Verify vectorizer ISA gate contracts
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_vectorize_isa_gate.sh

      # Byte-compare window phase (`while (p < end && *p == *q)`, the
      # match-extension shape): 32B AVX2 / 16B SSE2 windows, the q-side
      # PAGE-CROSSING guard (without it the phase loads into a PROT_NONE
      # page and dies -- mutation-verified), the exact ctz mismatch exit,
      # and the LCCC_NO_BYTECMP_VEC kill switch.  Both behavioural drivers
      # run under every width configuration and are compared against GCC,
      # which does not vectorize this shape at all.
      - name: Verify byte-compare window phase
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_bytecmp_vec_codegen.sh

      # Vector copy elimination (peephole passes/vector_copy.rs): the GP copy
      # machinery declines every vector family by construction, so the
      # codegen's fresh-temporary bracketing reached the assembler as
      # copy-in/copy-out pairs nothing removed. Three pinned contracts:
      # the oracle instruction shapes (floor/fma/round wins vs ICX/GCC),
      # runtime equality with the reference compiler on kernels built to hit
      # every legality rule (live-in temporaries, packed reads, calls and
      # branches inside brackets, xmm/ymm aliasing, FMA families, AVX-512
      # where the host has it), and a corpus instruction ratchet so the
      # copies cannot come back unmeasured.
      - name: Verify vector copy elimination contracts
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_vector_copy_elimination.sh

      # Call-argument staging (PR #584's miscompile class): the FP liveness
      # oracle's call model must never mark live SSE-argument staging dead.
      # The chain that broke: the GP dead-write pass legitimately deletes the
      # `movb $N, %al` census at non-variadic callees, the fallback window
      # walk broke at the hazard-area release / stack-argument pushes / relay
      # GP halves, and eliminate_dead_vector_copies deleted the staging (a
      # 10-double call lost 7 of 8 register arguments). Pinned end to end:
      # runtime equality with the reference compiler on volatile 8..12-ary
      # f64/f32, mixed GP+SSE, SSE structs, negation compositions, indirect
      # and in-loop calls; the `# LCCC_CALL_FP` authority-marker counts; the
      # census lifecycle (deleted at prototyped callees, kept at variadic);
      # and all eight registers staged in the 10-argument window.
      - name: Verify call-argument staging contracts
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_call_arg_staging.sh

      # Loop-invariant LEA hoisting (guarded/fall-through-entry loops) and
      # the direct 3-operand RORX: two loop-body instruction-quality
      # contracts from the worst-15 benchmark campaign. The K-table
      # rematerialization inside the 64-round loop (sha256_transform at
      # 1.20x gcc) and the staged `movq` before every `rorxl` (BMI2 RORX
      # is non-destructive; a fresh register home is read in place).
      - name: Verify LEA hoist and RORX contracts
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_lea_hoist_rorx.sh

      # Integer-parameter provenance (P1 follow-up): a laundered
      # `(T *)(uintptr_t)raw` copy keeps its runtime guard while a genuine
      # pointer-param copy stays guard-free, plus runtime bit-exactness.
      - name: Verify integer-parameter provenance contracts
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_provenance_int_param.sh

      # Persist-gate C-level verdicts: the four probe nests (goto-bound
      # init, runtime limit, IV-decided limit, folded limit) keep their
      # veto/allow decisions and nest shapes end to end from C sources.
      - name: Verify unroll-gate verdict contracts
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_unroll_gate_verdicts.sh

      # CH/MAJ oracle consensus (session 585): the SHA-256 mux fold defers
      # to the backend's 3-operand ANDN under BMI1, the majority keeps its
      # earliest And (composite last, no park), and the acc-resident ALU
      # consumption eliminates the exposed store-to-load forwards.
      - name: Verify CH/MAJ codegen contracts
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_ch_maj_codegen.sh

      # Worst-15 follow-up (session 586): nbody pair-loop load CSE (copy-web
      # leaves + stride-period field disjointness) and same-value FP squares
      # reading the register once. The rbtree derived-IV recurrence was
      # removed from this gate after the S46 CI RED post-mortem: the scalar
      # flavor measured as a net loss (see iv_strength_reduce.rs) and is now
      # opt-in via CCC_IVSR_SCALAR_DERIVED=1.
      - name: Verify nbody/rbtree perf shape contracts
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_nbody_perf_shapes.sh
      - name: Verify IVSR scalar-derived default pin
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_ivsr_scalar_derived_default.sh

      # linux_find_bit: the inliner's bounded-tier clone-growth budget must
      # admit the three-site kernel clone (two cold self-test calls + one
      # hot in-loop call) that GCC/Clang/ICX all inline, and the inlined
      # shape must keep the tzcnt + andn idiom distillations.
      - name: Verify linux_find_bit inlining contract
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_findbit_inline.sh

      # Cross-PR interaction red-team (session 574): the per-feature gates
      # pin each PR's own contract; this one pins the INTERACTIONS between
      # the last ten merged PRs — FMA families through copy brackets, calls
      # and branches; fma under if-conversion; the shared-negation phi
      # diamond (multi-use peel); constant-table promotion under aliasing;
      # guarded clz/ctz over promoted arrays; wide SLP FMA packs; the
      # AVX1+FMA target class (-mno-avx2 keeps VEX.128 and the families);
      # and the uncontracted SSE2 baseline. Bit-exact against the reference
      # compiler at matched march (sign of zero and infinities included —
      # that is what pins the family selection), with only canonical NaN
      # patterns normalised (C11 6.5p8 latitude; double-NaN propagation
      # order is operand-placement dependent).
      - name: Verify cross-PR interaction red-team contracts
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_cross_pr_redteam.sh

      # Peephole phi-diamond preinitialisation safety: the hoisted incoming
      # may only be a register, immediate, or plain stack slot — a user-memory
      # source made `c ? *p : *q` dereference a NULL p on the path that never
      # reads it. Runtime battery over every branch polarity and arm-width
      # mix, plus the register-init positive control (the optimisation must
      # survive its own safety fix).
      - name: Verify peephole phi-hoist safety contracts
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_peephole_phi_hoist_safety.sh

      # Constant-array promotion: fully-constant local arrays become
      # .rodata globals. Emission contracts (the .LCA_ global, store
      # elimination, rip-relative references, alignment preservation)
      # AND the fail-closed rejections the red-team battery drove:
      # the variable-index runtime store (invisible to the original
      # const-offset classifier — promoted straight into .rodata),
      # the pointer-induction callee reader (must PROMOTE, not
      # reject), and the `return a;` terminator escape (must compile
      # without an ICE). Every config is executed, not just checked.
      - name: Verify constant-array promotion contracts
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_const_array_promote.sh

      # Branch-condition range fusion (range_fold): the fused sub+unsigned
      # compare must appear for the foldable shapes and stay absent for the
      # adversarial ones (different values, mixed signedness, value-context
      # uses, side effects between the tests, two-predecessor check blocks,
      # wrapped/empty unsigned domains, unrepresentable spans).
      - name: Verify range-fold branch contracts
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_range_fold_branch.sh

      # BB-SLP v6 (the gate ci.yml was missing — ci_local.sh had it): the
      # 128-bit VEX memory fold, FP negation sign-mask, integer min/max
      # folds, the general cmp+blendv composite, and the rule-(b)
      # cross-block relaxation, plus the W5 register-homing contracts.
      - name: Verify basic-block SLP v6 contracts
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_bb_slp_v6_codegen.sh

      # Compare-replay home-rewrite contract: a multi-select compare-replay
      # must never trust a register-homed operand across an emission gap
      # that rewrites its home (the RA's latch/phi-web coalescing shares one
      # register between a guarded-update Select result and the loop-carried
      # accumulator; the first select's cmov invalidates the shared home for
      # the second select's re-emitted compare — kernel 6.18.50
      # kernel/irq/affinity.c get_pcore_mask ICE, and a silent
      # wrong-accumulator-compare variant). The gap audit prunes the record;
      # the Cmp materializes at its own position.
      - name: Verify compare-replay gap home-rewrite audit
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_replay_gap_home_rewrite.sh

      # Assembler segment-prefix contract for RMW memory encodings: the
      # integrated assembler must not drop a %gs/%fs override from the
      # template on unary/RMW arms (inc/dec/neg/not, xchg, xadd) — the
      # kernel's per-CPU preempt_count ops are exactly this shape, and 1,125
      # unprefixed incl/decl sites silently updated the STATIC percpu image
      # while every %gs read saw the real per-CPU counter (6.18.50 boot
      # died at PID 1 with "corrupted preempt_count").
      - name: Verify RMW segment-prefix encoding
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_seg_prefix_rmw_encoding.sh

      # Full instruction×segment matrix: the integrated assembler's
      # segment-qualified memory encodings must be BYTE-IDENTICAL to GNU as
      # across every family (ALU sizes, shifts, bt, cmpxchg/8b/16b, x87,
      # SSE, VEX, lock ordering, prefix ordering) plus the i686/code32
      # default-segment rule, tab-separated macro conditionals, and the
      # stray-.else/.endif hard error. Emission lives at ONE choke point
      # (the operand scan in InstructionEncoder::encode); this gate is the
      # contract that no encoder arm can regress it again.
      - name: Verify segment-prefix full matrix vs GNU as
        env:
          CCC: target/fastbuild/lccc
        run: bash tests/regression/check_seg_prefix_full_matrix.sh

      # The isolated PR #629 x86-64 corpus uses APX encodings unavailable
      # in ubuntu-latest's distro binutils. Install the pinned oracle instead
      # of silently skipping its 90-case accepted/rejected differential gate.
      - name: Install GNU as 2.47 for x86-64 differential
        run: bash scripts/ensure_gas_247.sh x86_64-linux-gnu

      - name: Verify x86-64 assembly differential vs GNU as 2.47
        run: python3 scripts/asmdiff.py --jobs 2 --as "$HOME/.cache/gas-2.47-x86_64-linux-gnu/bin/as" --objdump "$HOME/.cache/gas-2.47-x86_64-linux-gnu/bin/objdump" --lccc target/fastbuild/lccc-x86

      # Whole-object ELF32 differential corpus, including relocation/addend
      # ownership for bare memory operands and relaxation-patched loop/jecxz.
      # Pinned to the same GNU as + objdump 2.47 PAIR as the x86-64
      # differential: the byte-exact layout cases (NOP tables, relaxation
      # order) differ between GAS releases -- 2.44 places the lea-NOP
      # remainder after the long NOP, 2.47 before it -- and the betterok
      # groups' smaller-encoding verdicts are arbitrated by the pinned
      # objdump, so neither half of the pair may come from the runner image.
      - name: Verify i686 assembly differential vs GNU as 2.47
        run: python3 scripts/asmdiff.py --32 --jobs 2 --as "$HOME/.cache/gas-2.47-x86_64-linux-gnu/bin/as" --objdump "$HOME/.cache/gas-2.47-x86_64-linux-gnu/bin/objdump" --lccc target/fastbuild/lccc-i686

      # The encdiff corpus is the semantic record of every deliberate
      # divergence from GAS (index-fold families incl. the AVX-512 EVEX
      # fold and segment+fold, and the APX x AVX-512 oracle record; the
      # 64-bit data16-branch law). Offline mirror of ci_local's
      # encdiff-corpus gate: the pinned 2.47 oracle PAIR (as decides the
      # bytes, objdump decides the verdicts), the checked-in verdict-count
      # baseline, exit 1 on WRONG-BYTES/UNVERIFIED-*/REJECTS-VALID/LONGER
      # and on a histogram drift.
      - name: Verify encdiff corpus vs GNU as 2.47 (offline)
        run: |
          python3 scripts/encdiff.py --offline --quiet \
            --lccc target/fastbuild/lccc-x86 \
            --as "$HOME/.cache/gas-2.47-x86_64-linux-gnu/bin/as" \
            --objdump "$HOME/.cache/gas-2.47-x86_64-linux-gnu/bin/objdump" \
            --expect-histogram tests/encdiff-corpus/expected-verdicts.txt \
            --file tests/encdiff-corpus/index-fold-64.insn \
            --file tests/encdiff-corpus/data16-branches-64.insn

      # The gate-parity checker and the workflow-shell checker parse this
      # very file (and every other workflow) through PyYAML. The runner
      # images ship it, but that is an image property, not a declared
      # dependency of a REQUIRED gate — a future image change (or a
      # self-hosted runner) must not turn the parity gate into a
      # ModuleNotFoundError. Declared here, at the point of first use.
      - name: Install checker dependency (PyYAML)
        run: sudo apt-get install -y --no-install-recommends python3-yaml

      # The four AArch64 gates below are the pinned-oracle ones, and they are
      # pinned for the same reason the x86-64 differential is: ubuntu-latest's
      # distro cross-binutils are older than the instructions this backend
      # encodes, so a distro fallback would fail loudly on rows that are not
      # defects (measured against the 2.47 pair: the distro `as` disagrees with
      # 1077 rows the pin accepts).  Every invocation below therefore spells the
      # pinned pair under $HOME/.cache literally -- scripts/check_ci_gate_parity.py
      # matches exact tokens, and a `$(command -v ...)` lookalike is a mismatch,
      # not a spelling -- which means this job must provision the pin first.
      - name: Install GNU as 2.47 for AArch64 differential
        run: bash scripts/ensure_gas_247.sh aarch64-linux-gnu

      # AArch64 differential oracle: harness self-test only. The full sweep
      # is ~25,000 assembler invocations and belongs to an offline run, but
      # the harness's own invariants must hold on every pass -- an oracle
      # that has drifted out of agreement with GAS reports "OK" for
      # everything and proves nothing.
      - name: AArch64 differential oracle self-test
        run: |
          set -euo pipefail
          python3 scripts/aarch64_encoder_differential.py --self-test-only \
            --gas "$HOME/.cache/gas-2.47-aarch64-linux-gnu/bin/as" \
            --objdump "$HOME/.cache/gas-2.47-aarch64-linux-gnu/bin/objdump" \
            --objcopy "$HOME/.cache/gas-2.47-aarch64-linux-gnu/bin/objcopy" \
            --lccc target/fastbuild/lccc

      # Operand-legality matrix, both halves: `--check` re-derives every row
      # from the pinned assembler (so the table cannot rot silently), and
      # `--check-lccc` asserts the same 10411 rows against our own encoder (so a
      # correct table cannot hide a wrong encoder).  This is the instrument for
      # the bug class the differential oracle above is structurally blind to:
      # an invalid operand combination is not an encoding, so objdump can never
      # emit one for the oracle to re-assemble.
      #
      # The `--as` pin matters on the ENCODER half too, and that is the half
      # that silently degrades without it: `--check-lccc` reads the rejections'
      # rows by re-deriving them, so with no `--as` and no distro cross-`as` on
      # PATH the gate prints "cross-binutils not found; cannot verify" and
      # exits 0 -- a skip wearing a pass.
      - name: AArch64 operand-legality matrix
        run: |
          set -euo pipefail
          bash scripts/ensure_gas_247.sh aarch64-linux-gnu
          python3 scripts/aarch64_operand_legality_matrix.py --check \
            --as "$HOME/.cache/gas-2.47-aarch64-linux-gnu/bin/as" \
            --objcopy "$HOME/.cache/gas-2.47-aarch64-linux-gnu/bin/objcopy"
          python3 scripts/aarch64_operand_legality_matrix.py \
            --check-lccc target/fastbuild/lccc \
            --jobs 2 \
            --as "$HOME/.cache/gas-2.47-aarch64-linux-gnu/bin/as" \
            --objcopy "$HOME/.cache/gas-2.47-aarch64-linux-gnu/bin/objcopy"

      # The two instruments the matrix cannot replace.  The spelling differ
      # reaches "the same instruction written another way" (a rejected spelling
      # that objdump never prints, and an accepted alias the table never
      # spelled); the sysreg gate holds the generated system-register table
      # against the .def it came from and the pin, in both directions.  Both
      # need only the pin and the fastbuild binary.
      - name: AArch64 spelling differ and system-register table
        run: |
          set -euo pipefail
          python3 scripts/aarch64_legality_probe_differ.py \
            --lccc target/fastbuild/lccc \
            --as "$HOME/.cache/gas-2.47-aarch64-linux-gnu/bin/as" \
            --objcopy "$HOME/.cache/gas-2.47-aarch64-linux-gnu/bin/objcopy"
          python3 scripts/aarch64_sysreg_table.py --check \
            --as "$HOME/.cache/gas-2.47-aarch64-linux-gnu/bin/as" \
            --objcopy "$HOME/.cache/gas-2.47-aarch64-linux-gnu/bin/objcopy" \
            --lccc target/fastbuild/lccc

      # Family sweeps: the generated cross products for the three families
      # whose rules are combinatorial (the twelve scalar SIMD&FP conversions,
      # CASP's register pairs, add/sub's shifted and extended operands) -- 2703
      # spellings, both verdicts, ~20 s.  The matrix pins one row per slot
      # shape a human chose; these families are where the spaces between those
      # rows live, and each of the three produced a measured defect.
      - name: AArch64 family sweeps
        run: |
          set -euo pipefail
          python3 scripts/aarch64_family_sweeps.py \
            --lccc target/fastbuild/lccc \
            --as "$HOME/.cache/gas-2.47-aarch64-linux-gnu/bin/as" \
            --objcopy "$HOME/.cache/gas-2.47-aarch64-linux-gnu/bin/objcopy"

      # Layout/directive bugs (`.p2align N,,M`) are invisible to the word
      # oracle: compile every tests/regression/arm_*.c, assemble it with the
      # integrated assembler and byte-compare .text against GNU as.
      - name: ARM codegen assembler-parity
        run: |
          set -euo pipefail
          CCC_ARM=target/fastbuild/lccc-arm scripts/check_arm_codegen_assembles.sh

      # Keep every standalone gate from ci_local.sh represented in hosted CI.
      # Group the compact contracts to avoid YAML drift and setup overhead;
      # the expensive codegen-quality gate remains in bench.yml.
      - name: Verify remaining fast local contracts
        env:
          CCC: target/fastbuild/lccc
        run: |
          set -euo pipefail
          python3 scripts/check_ci_gate_parity.py
          # A `run: |` block is shell, not YAML. Step scaffolding pasted
          # into one is valid YAML that dies with exit 127 on the runner
          # and silently skips every gate sequenced after it.
          python3 scripts/check_ci_workflow_shell.py
          # The helper scripts are tools, not gates, so nothing in the
          # suite ever imports them. Check their imports via the AST so a
          # tool that cannot run cannot ship unnoticed.
          python3 scripts/check_script_imports.py
          python3 scripts/test_ci_gate_parity.py
          ENCDIFF_TEST_OBJDUMP="$HOME/.cache/gas-2.47-x86_64-linux-gnu/bin/objdump" \
          LCCC_REQUIRE_PINNED_ORACLE=1 \
            python3 scripts/test_encdiff.py
          # The differential oracle's own contract suites, compiler-free
          # like the encdiff one but anchored to the REAL pinned pair
          # (provisioned above): asmdiff's parser/oracle unit tests
          # (mocked failure modes plus a real-toolchain leg) and the
          # binutils provisioner's 2.47 validation matrix (fake tool
          # pairs). The pinned-tool env channels and the require-mode
          # flag are part of the registered invocation contract
          # (check_invocation_contracts): a leg that would silently skip,
          # or run against the runner's distro binutils, is a contract
          # violation — never a local convenience.
          ASMDIFF_TEST_AS="$HOME/.cache/gas-2.47-x86_64-linux-gnu/bin/as" \
          ASMDIFF_TEST_OBJDUMP="$HOME/.cache/gas-2.47-x86_64-linux-gnu/bin/objdump" \
          LCCC_REQUIRE_PINNED_ORACLE=1 \
            python3 scripts/test_asmdiff.py
          bash scripts/ensure_gas_247.sh --self-test
          # EDG/corpus compiler-free tooling contracts: the
          # miner self-tests, the mocked corpus-runner verdict contracts,
          # and the corpus-exclusion path tests gate the TEST
          # INFRASTRUCTURE itself — no compiler needed.  Mirrored in
          # scripts/ci_local.sh (parity-checked).
          python3 scripts/edg_changes_mine.py selftest
          python3 scripts/edg_corpus_mine.py selftest
          python3 scripts/edg_corpus_mine.py verify-index
          python3 scripts/edg_changes_mine.py verify-artifacts
          python3 -m unittest discover -s tests/corpus -p 'test_*.py'
          bash tests/regression/check_frontend_diagnostic_recovery.sh
          # E5 (EDG register): deep-nesting crash class -> clean bounded
          # error; deep-but-legal inputs keep compiling; in-budget nesting
          # evaluates correctly end to end.
          python3 scripts/check_deep_nesting_robustness.py
          python3 scripts/test_differential_corpus_paths.py
          bash tests/regression/check_loop_memset.sh
          bash tests/regression/check_bool_pair_tail_jmp.sh
          bash tests/regression/check_bool_pair_prune.sh
          bash tests/regression/check_demorgan_branch_split.sh
          bash tests/regression/check_gvn_xsign_load_cse.sh
          bash tests/regression/check_gvn_cross_block_mul_dot.sh
          bash tests/regression/check_call_secondary_cache.sh
          # ZERO-REM-1: the map vectorizer's scalar remainder mirror must be
          # omitted (not merely unreachable) when a constant trip count makes
          # it dead, on every shape where that is provable and on none where
          # it is not -- including the alias-guard fallback, where the mirror
          # is live.
          bash tests/regression/check_vec_dead_remainder.sh
          # ZERO-REM-2 + chained exit phis: the hoisted FMA transform's A
          # factor lives in a fixed register (%ymm1) with no SSA edge to its
          # consumers, so every entry edge into a vectorized loop must
          # re-establish it; a k-unrolled chain enters j-loop N+1 on a
          # conditional arm of j-loop N's header.  Pins oracle parity, the
          # one-broadcast-per-packed-loop ratio, and broadcast-or-refuse.
          bash tests/regression/check_vec_chain_exit_phi.sh
          # ZERO-ROT-AFFINE: loop_rotate's cloned exit compare folds its
          # affine constant operand into the bound (signed only), giving a
          # bare-IV compare the compare-branch fusion can fuse -- without the
          # FileLiveness backward-edge fix the fusion refused the rotated
          # setcc shape and the `leaq` temporary stayed per-iteration.
          bash tests/regression/check_affine_exit_compare.sh
          # MINMAX-1: integer min/max reductions lower to packed vpmin/vpmax
          # on AVX2, and every shape the transform does not model (unsigned,
          # 16-bit, float, guarded, multi-accumulator) stays scalar AND stays
          # correct.
          bash tests/regression/check_minmax_reduction.sh
          # LICM must not hoist a volatile load out of its loop: N observable
          # accesses must not become 1 (C11 5.1.2.3). The runtime cannot see
          # this -- a hoisted volatile load computes the same answer -- so the
          # gate asserts it structurally, with a non-volatile load in the same
          # shape as the negative control. Complements the spin-loop and
          # subscript gates above: this one covers the do-while shape.
          bash tests/regression/check_volatile_licm.sh
          # Dedicated-preheader transform, asserted on emitted assembly.
          bash tests/regression/check_loop_preheader.sh
          # Same unwired-gate fix as in ci_local.sh: these assert volatile
          # access semantics that no runtime comparison can observe.
          bash tests/regression/check_volatile_pointer_subscript.sh
          bash tests/regression/check_volatile_access_semantics.sh
          # One entry, one preheader: a loop with several entries must not get a
          # speculative load hoisted into a preheader that only one entry passes.
          bash tests/regression/check_multi_entry_loop.sh
          # A function DEFINITION's own `aligned(N)`, and the rule that an
          # attribute REPLACES `-falign-functions` instead of merging with it
          # (`aligned(1)` suppresses the directive).  Parameterized spellings
          # plus two unannotated controls.
          bash tests/regression/check_function_alignment_definition.sh
          # One comparison, one set of flags: cmov reads EFLAGS without
          # writing it, so a cmov chain sharing a condition needs one cmp.
          # Carries its own CCC_PEEPHOLE_SKIP negative control.
          bash tests/regression/check_redundant_flags_compare.sh
          # Downward counter loops: `subl $1, %R; testl %R, %R; jne` keeps one
          # instruction of pure overhead unless the consumer walk proves ZF is
          # the only flag read.  Pins both directions (folded for ZF-only
          # consumers, kept for `while ((n -= 3) > 0)`) plus a matcher
          # self-test, so it cannot pass vacuously.
          bash tests/regression/check_self_test_after_arith.sh
          # The loop-density metric decides which compiler wins on a kernel,
          # so its loop identification is tested like a pass: dominator-based
          # backedges, composite loops never measured, step recovery through
          # index addressing.
          python3 scripts/test_hot_loop_metric.py
          python3 scripts/test_godbolt_cache.py
          python3 scripts/test_glibc_check_triage.py
          python3 scripts/test_oracle_delta_gate.py
          python3 scripts/oracle_delta_gate.py --self-test
          python3 scripts/glibc_check_triage.py --self-test
          bash tests/regression/check_copy_alias_sizes.sh
          bash tests/regression/check_linker_notype_code.sh
          bash tests/regression/check_got64_old_spelling.sh
          bash tests/regression/check_tls_pie_preemptible.sh
          bash tests/regression/check_tls_model_selection.sh
          # The peephole folds and the affine exit-compare fold: oracle parity
          # at every opt level times every kill switch, plus the asm pins that
          # say the fold actually fired (and stayed off when refused).
          bash tests/regression/check_rmw_sib_folds.sh
          bash tests/regression/check_select_from_compare.sh
          bash tests/regression/check_affine_loop_fold.sh
          bash tests/regression/check_phi_acyclic_order.sh
          # The FMA contract gate (packed arm exact at 4, zero under
          # -ffp-contract=off / -mno-fma, unproven shapes refused) and the wide
          # inclusive-bound envelope behind it.  A regression test that nothing
          # runs is the defect these were written to fix, so they run here AND
          # in ci_local.sh -- scripts/check_ci_gate_parity.py fails if the two
          # lists drift, which is how this line came to exist.
          bash tests/regression/check_fma_gating.sh
          bash tests/regression/check_fma_matcher_guards.sh
          bash tests/regression/check_redundant_test_elimination.sh
          python3 tests/regression/verify_pr713_audit.py --quiet
          python3 scripts/check_doc_links.py
          bash tests/regression/check_ra_web_inloop_use.sh
          bash tests/regression/check_store_alu_cross_join.sh
          bash tests/regression/check_gla_remat_policy.sh
          bash tests/regression/check_gla_cross_reach_band.sh
          bash tests/regression/check_gla_backedge_no_trampoline.sh
          bash tests/regression/check_tight_loop_align.sh
          bash tests/regression/check_i686_atomics.sh
          bash tests/regression/check_i686_tls_ie_relax.sh
          bash tests/regression/check_i686_integer_isa_parity.sh
          bash tests/regression/check_map_i64_two_lane.sh
          bash tests/regression/check_fortify_diagnose_as.sh
          bash tests/regression/check_asm_case_insensitive.sh
          bash tests/regression/check_debug_info_flags.sh
          bash tests/regression/check_dep_files.sh
          bash tests/regression/check_i686_boot_asm.sh
          bash tests/regression/check_narrow_cmp_flag_law.sh
          bash tests/regression/check_zero_ext_cmp_fold.sh
          bash tests/regression/check_boot_size_measurement.sh
          bash tests/regression/check_env_test_hygiene.sh
          bash tests/regression/check_peephole_whitespace.sh
          # The wrapper's argument parsing is exercised separately: it once
          # stored the literal `--phase` flag, selected nothing, ran no phase
          # and still printed PASS.  The invariance gate above cannot see that,
          # so the parser gets its own compiler-free case table.
          bash tests/regression/check_peephole_whitespace.sh --selftest
          bash tests/regression/check_peephole_trace_bisect.sh
          # The trace-bisect tool is also exercised directly, so a broken
          # operand parser fails CI even if the wrapper gate is skipped.
          python3 scripts/peephole_trace_bisect.py --selftest
          bash tests/regression/check_atomic_backends.sh
          # Torture-corpus provisioning: stamp trust, integrity manifest,
          # auto-repair and invalidate-before-replace (synthetic tarball).
          bash tests/regression/check_ensure_gcc_torture.sh
          # Indexed SIB fold with a scratch-homed index: the x86-64 fold
          # decider must accept %rdx/%r11-homed SIB operands (S13
          # sqlite_varint golden-gate regression pin).
          bash tests/regression/check_indexed_fold_scratch_index.sh
          # _Decimal64 indexed fold: SIB-movsd load+store assertions
          # plus an integer-checksum gcc differential.
          bash tests/regression/check_decimal64_indexed_fold.sh
          # _Decimal32 AArch64 width: w-view indexed + plain traffic
          # assertions plus encodability teeth (no bare mov past imm16).
          bash tests/regression/check_decimal32_indexed_fold_arm.sh
          # FMA-negation peel deletion invariant, re-derived over the enumerated
          # shape space: a pure model check (no compiler, sub-second) so a
          # regression of the absorbability classification is caught even where
          # the IR verifier is not wired after the pass.
          python3 tools/ir_shape_check.py

      # Kbuild tracks command lines but not the contents of CC/LD executables.
      # A rebuilt compiler at the same path must invalidate every target
      # product; a linker-only rebuild should retain expensive object files.
      - name: Verify kernel tool-identity invalidation
        run: bash tests/regression/check_kernel_tool_identity.sh

      # The relocation cross-check's decision logic, tested directly.  It
      # needs no built linker and no oracle linker, so it runs on every host:
      # the paths it pins (two oracles going `inapplicable`, one crashing,
      # the reference having no opinion) are exactly the ones a host with
      # only bfd installed never exercises end-to-end.
      - name: Relocation oracle-verdict logic
        run: python3 tests/linker/test_reloc_oracle_verdict.py

      # Deterministic bounded fuzzing catches parser/linker panics without
      # making ordinary PRs depend on an unbounded corpus or external fuzzer.
      - name: Run linker fuzz smoke
        env:
          LCCC_LD: ${{ github.workspace }}/target/fastbuild/lccc-ld
          FUZZ_N: "128"
          FUZZ_SEED: "20260906"
        run: |
          python3 tests/linker/fuzz_ld.py
          python3 tests/linker/fuzz_elf_grammar.py \
            --lccc "$LCCC_LD" \
            --iters 64 \
            --seed "$FUZZ_SEED"

      # arch/x86/tools/relocs, the kernel's own consumer of --emit-relocs,
      # built from SHA-256-pinned v6.12 sources (emit_relocs_kernel_relocs_tool).
      - name: Cache kernel relocs tool
        uses: actions/cache@v6
        with:
          path: ~/.cache/lccc-kernel-tools
          key: ${{ runner.os }}-kernel-tools-${{ hashFiles('tests/linker/setup_kernel_tools.sh') }}

      - name: Build kernel relocs tool
        run: bash tests/linker/setup_kernel_tools.sh --prefix "$HOME/.cache/lccc-kernel-tools"

      # The whole linker suite (x86-64 and ELF32/i386; executables, PIE,
      # shared objects, scripts, relocatable links, TLS, GOT relaxation,
      # eh_frame/GC, malformed input) against the GNU ld reference.
      # --strict fails on any SKIP or WARN: this job installs every tool the
      # suite uses (gcc/g++ multilib, GNU ld, the relocs tool), so a test
      # that did not run is a broken runner or harness, never a pass.
      # LCCC_REQUIRE_I386=1 does the same for the i386 multilib probe.
      # Fixtures assemble with the pinned GNU as 2.47 installed above (APX
      # REX2 / R_X86_64_CODE_4_* encodings), not the runner's older gas.
      - name: Linker test suite (lccc-ld vs GNU ld, x86-64 + i386)
        env:
          LCCC_I386_SCRATCH_ROOT: ${{ runner.temp }}/i386-linker-scratch
        run: |
          PATH="$HOME/.cache/gas-2.47-x86_64-linux-gnu/bin:$PATH" \
          LCCC_REQUIRE_I386=1 \
          LCCC_RELOCS_TOOL="$HOME/.cache/lccc-kernel-tools/bin/relocs" \
            python3 tests/linker/run_linker_tests.py \
              --lccc target/fastbuild/lccc --strict -v \
              --json "$RUNNER_TEMP/linker-results.json"

      # Passing cases delete their scratch directories, so what remains is
      # the sources, objects, links and outputs of exactly the failing cases.
      - name: Upload linker results and i386 scratch on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linker-test-failures
          path: |
            ${{ runner.temp }}/linker-results.json
            ${{ runner.temp }}/i386-linker-scratch
          if-no-files-found: ignore

      # Every corpus gate above runs a compiler binary whose fastbuild
      # profile compiles debug_assertions OUT - so the %rax shadow-epoch
      # validator and every other debug-only invariant never observe real
      # codegen in CI. This closing step rebuilds the compiler with
      # assertions forced ON (profile env-override; distinct unit
      # fingerprints, so the earlier gates' artifacts stay cached) and
      # re-runs the SSA-validated regression corpus against real codegen.
      # It runs LAST deliberately: the assertions-ON binary overwrites the
      # target/fastbuild/lccc path, and no later step in this job USES it -
      # only the artifact upload follows, and `if: always()` publishes this
      # step's JSON/log even when it fails (a gate that fails without its
      # artifacts is a report without evidence). A missed invalidate_acc()
      # on any corpus-covered dataflow now fails CI here - loudly, naming
      # the value, both epochs, and the last unclassified emitted line.
      #
      # NOT a duplicate of "Run tests (debug-assertions on)": that step
      # exercises the in-process unit suite (every pass's debug-only
      # invariant); this one exercises the validator end-to-end over real
      # codegen dataflow through the compiler binary. Different layers:
      # dropping either one silently unobserves that layer's debug-only
      # contract. The build cost is shared (same profile override, so this
      # step's build is a cache hit of the unit step's) and the marginal
      # cost of keeping both is the corpus runtime itself.
      - name: Regression corpus (debug-assertions compiler)
        env:
          CCC_VALIDATE_SSA: "1"
          CARGO_BUILD_JOBS: "2"
          RUSTFLAGS: -D warnings
        run: |
          set -o pipefail
          CARGO_INCREMENTAL=0 cargo build --profile fastbuild --bin lccc --locked -j 2 \
            --config 'profile.fastbuild.debug-assertions=true' \
            --config 'profile.fastbuild.incremental=false' \
            --config 'profile.fastbuild.debug=0'
          python3 tests/regression/run_regression.py \
            --lccc target/fastbuild/lccc \
            -j 2 \
            --json regression-dbgassert-results.json 2>&1 | tee regression-dbgassert-results.log
      # The result artifacts are retained already, but GitHub's public job
      # view truncates long outputs, and a gate that fails without its
      # artifacts is a report without evidence. This step runs at the very
      # END of the job so `if: always()` also publishes what the closing
      # debug-assertions corpus gate wrote
      # (regression-dbgassert-results.{json,log}) when IT fails.
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-results
          path: |
            regression-results.json
            regression-results.log
            regression-dbgassert-results.json
            regression-dbgassert-results.log
            ci-regression-environment.txt
            inline-asm-utf8.json
          if-no-files-found: warn

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo clippy --all-targets --profile fastbuild --locked -j 2 -- -D warnings

  # MS-01 (competitive half): compare LCCC against GCC / Clang / ICX on
  # Compiler Explorer and fail on regression against the committed baseline.
  # Networked, so a Compiler Explorer outage is a recorded skip (exit 0), never
  # a red build; the self-tests in the `test` job pin the gate logic itself.
  oracle-delta:
    name: Compiler Explorer oracle delta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build LCCC (fastbuild)
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo build --profile fastbuild --locked -j 2 --bin lccc

      - name: Oracle delta gate (LCCC vs GCC 16.2 / Clang / ICX)
        run: |
          python3 scripts/oracle_delta_gate.py \
            --local target/fastbuild/lccc \
            --report results/oracle-delta/report.json

      - name: Upload oracle report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-delta
          path: results/oracle-delta/
          if-no-files-found: ignore
