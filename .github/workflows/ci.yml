name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      # Do not cache `target/` across commits.  A source-independent target
      # cache can leave a release compiler from a prior revision beside fresh
      # sources, making the regression gate test the wrong binary. Registry
      # and git dependency caches above retain the useful network speed-up;
      # the compiler executable is deliberately rebuilt from this checkout.

      - name: Verify manifest Rust-toolchain selection
        run: bash tests/regression/check_rust_toolchain_selector.sh

      # Keep CI on the documented compiler build policy: Rust -O1 and
      # two jobs.  This is deliberately not Cargo's default release -O3.
      - name: Build
        run: ./scripts/build_lccc_o1_j2.sh

      - name: Run tests
        env:
          CARGO_BUILD_JOBS: "2"
          RUSTFLAGS: -D warnings
        # Keep every Rust compilation that produces LCCC code at the project
        # fastbuild policy: opt-level 1 and no more than two Cargo jobs.
        run: cargo test --profile fastbuild --all-targets --locked -j 2

      # Record the exact host/toolchain contract beside the regression JSON.
      # Hosted runners vary their GCC/binutils versions and exposed CPU flags;
      # a failing native-code test is not diagnosable from an exit status alone.
      - name: Record regression environment
        run: |
          {
            echo '== system =='
            uname -a
            cat /etc/os-release || true
            echo '== locale =='
            locale || true
            echo '== Rust =='
            rustc -Vv
            cargo --version
            echo '== C toolchain =='
            gcc --version | head -1
            as --version | head -1
            ld --version | head -1
            echo '== CPU flags =='
            grep -m1 -E '^flags[[:space:]]*:' /proc/cpuinfo || true
            echo '== tested compiler =='
            sha256sum target/release/lccc target/release/lccc-ld
          } | tee ci-regression-environment.txt

      # This is deliberately a bounded-parallel full corpus rather than a
      # hand-picked smoke: the SSA validator catches stale value watermarks
      # and duplicate definitions only after real optimization/codegen paths.
      # Two workers keep the release compiler and simultaneous linker jobs
      # within GitHub's standard runner memory envelope.
      - name: Run regression corpus with SSA validation
        env:
          CCC_VALIDATE_SSA: "1"
        run: |
          set -o pipefail
          python3 tests/regression/run_regression.py \
            --lccc target/release/lccc \
            -j 2 \
            --json regression-results.json 2>&1 | tee regression-results.log

      # The result artifact is retained already, but GitHub's public job view
      # hides raw logs/artifacts from anonymous triage. Turn each result into a
      # normal check annotation so the failing test and phase stay visible.
      - name: Surface regression failures in annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("regression-results.json")
          if not path.is_file():
              print("::error title=Regression harness::no regression-results.json was written")
          else:
              report = json.loads(path.read_text(encoding="utf-8"))
              failures = report.get("failures", [])
              if not failures:
                  print("::error title=Regression harness::runner failed before reporting a test result")
              for failure in failures:
                  name = failure.get("name", "unknown")
                  phases = ", ".join(failure.get("phases", [])) or "no phase"
                  detail = " ".join(str(failure.get("detail", "")).split())
                  detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Regression {name} ({phases})::{detail[:1500]}")
          PY

      # The ordinary C regression proves the inline asm executes.  This
      # byte-level gate additionally rejects the historical UTF-8-to-Latin-1
      # recoding in the emitted #APP region, including an adjacent-literal
      # multibyte sequence split.
      - name: Verify inline-asm UTF-8 assembly text
        run: |
          python3 scripts/check_inline_asm_utf8.py \
            --lccc target/release/lccc \
            --expect preserved \
            --json inline-asm-utf8.json

      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-results
          path: |
            regression-results.json
            regression-results.log
            ci-regression-environment.txt
            inline-asm-utf8.json
          if-no-files-found: warn

      # Deterministic bounded fuzzing catches parser/linker panics without
      # making ordinary PRs depend on an unbounded corpus or external fuzzer.
      - name: Run linker fuzz smoke
        env:
          LCCC_LD: ${{ github.workspace }}/target/release/lccc-ld
          FUZZ_N: "128"
          FUZZ_SEED: "20260906"
        run: |
          python3 tests/linker/fuzz_ld.py
          python3 tests/linker/fuzz_elf_grammar.py \
            --lccc "$LCCC_LD" \
            --iters 64 \
            --seed "$FUZZ_SEED"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo clippy --all-targets --locked -j 2 -- -D warnings
