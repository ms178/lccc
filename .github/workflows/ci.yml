    - name: Surface GNU vector alignment ABI failures in annotations
      if: failure()
      run: |
        [ -s "$RUNNER_TEMP/gnu-vector-align-abi.log" ] &&
          python3 scripts/ci_annotate_log.py --title "GNU vector alignment ABI" "$RUNNER_TEMP/gnu-vector-align-abi.log" || true
    - name: LCCC vs GCC compatibility suite
