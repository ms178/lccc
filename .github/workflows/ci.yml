  codegen:
    name: Codegen and runtime contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_FASTBUILD_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Enable temporary CI swap file
      run: bash scripts/ci_enable_swap.sh
    - name: Compute weekly apt cache key
      id: apt-epoch
      run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
    - name: Cache GCC 16 package downloads
      uses: actions/cache@v6
      with:
        path: ~/.cache/lccc-apt
        key: lccc-apt-debs-v1-${{ runner.os }}-${{ steps.apt-epoch.outputs.week }}
        restore-keys: |
          lccc-apt-debs-v1-${{ runner.os }}-
    - name: Install GCC 16 and i686 C runtime/development files
      env:
        LCCC_CI_APT_ARCHIVE_DIR: /home/runner/.cache/lccc-apt
      run: |
        bash scripts/ci_install_gcc16.sh --multilib
        sudo apt-get install -y --no-install-recommends qemu-user
    - name: Install differential linker oracles
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends mold lld
    - name: Verify GCC 16 C23 oracle
      run: |
        test "$(gcc-16 -dumpfullversion | cut -d. -f1)" = 16
        printf 'int main(void) { return 0; }\n' | gcc-16 -std=c17 -x c -fsyntax-only -
        printf 'int main(void) { return 0; }\n' | gcc-16 -std=c23 -x c -fsyntax-only -
        gcc-16 --version | head -n 1
    - name: Select GCC 16 for legacy oracle invocations
      run: |
        mkdir -p "$RUNNER_TEMP/lccc-oracles"
        ln -s "$(command -v gcc-16)" "$RUNNER_TEMP/lccc-oracles/gcc"
        ln -s "$(command -v g++-16)" "$RUNNER_TEMP/lccc-oracles/g++"
        echo "$RUNNER_TEMP/lccc-oracles" >> "$GITHUB_PATH"
    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    - name: Cache cargo index
      uses: actions/cache@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
    - name: Install gate parsers
      run: sudo apt-get install -y --no-install-recommends python3-yaml
    - uses: actions/download-artifact@v8
      with:
        name: lccc-fast-${{ github.sha }}
    - name: Verify exact compiler build
      run: |
        set -euo pipefail
        tar -xzf lccc-fast.tar.gz
        test "$(cat target/ci-build.commit)" = "$(git rev-parse HEAD)"
        sha256sum -c target/ci-build.sha256
    - name: Preserved synthesis and ordering contracts
      env:
        CCC: target/fastbuild/lccc
        GCC: gcc-16
      run: |
        set -euo pipefail
        python3 scripts/verify_evidence_hashes.py
        python3 scripts/check_licm_ordering.py
        python3 scripts/check_fenv_local_optimization.py --compiler target/fastbuild/lccc --native-only --output target/pr835-fenv --json target/pr835-fenv.json
        python3 scripts/check_byte_count_normalize.py --lccc target/fastbuild/lccc --gcc gcc-16 --output target/pr835-byte-count --json target/pr835-byte-count.json
        bash tests/regression/check_byte_accessor_inline.sh
        bash tests/regression/check_unsigned_affine_loop.sh
        python3 tests/regression/check_affine_wrapv_differential.py --lccc target/fastbuild/lccc --cc gcc-16
    - name: Benchmark output gate (workload kernels vs GCC oracle)
      env:
        GCC_BIN: gcc-16
      run: bash scripts/check_benchmark_outputs.sh
    - name: Differential correctness gate (lccc vs GCC 16 oracle)
      env:
        LCCC_BIN: target/fastbuild/lccc
        GCC_BIN: gcc-16
      run: python3 tests/correctness/run_correctness.py
    - name: Loop-alignment contract gate (emitted assembly)
      run: python3 scripts/check_loop_alignment.py --lccc target/fastbuild/lccc
    - name: i386 small-struct regparm ABI debt gate
      run: bash tests/regression/check_i386_regparm_small_struct_abi.sh
    - name: Scoped-noreturn diagnostic gate
      run: bash tests/regression/check_scoped_noreturn_diagnostics.sh
    # AUD-DRV-1: `-o -` is a stream, not a filename, wherever GCC says so
    # (measured on GCC 14.2); the gate's --self-test rejects a fake compiler
    # with the old file-named-`-` behavior.
    - name: Dash-output stdout gate
      run: bash tests/regression/check_dash_output.sh
    # AUD-SILENT-ZERO-1: x86-only intrinsics are a lowering-time diagnostic
    # on aarch64/riscv64, never silent zeros (mutation-tested sweep).
    - name: foreign-intrinsics rejected gate
      run: python3 scripts/check_foreign_intrinsics.py
    # PR #821 F1: user-authored AArch64 assembly is exempt from the
    # -mgeneral-regs-only SIMD guard via #APP/#NO_APP provenance brackets.
    - name: AArch64 inline-asm provenance gate
      run: bash tests/regression/check_arm_inline_asm_provenance.sh
    # PR #821 F3: shared-library ADR relocations prove the section-relative
    # precondition through the SECTION MAP.
    - name: AArch64 shared ADR contract gate
      run: bash tests/regression/check_arm_adr_shared_contract.sh
    # PR #821 F2: gABI-merged visibility drives export, st_other and the
    # ADR predicate; input contract and emitted ELF cannot disagree.
    - name: AArch64 shared visibility gate
      run: bash tests/regression/check_arm_visibility_shared.sh
    - name: i386 call-staging assembly gate
      run: bash tests/regression/check_i386_call_staging_asm.sh
    - name: Loop-inversion census
      run: python3 scripts/loop_invert_census.py --lccc target/fastbuild/lccc --quiet
    - name: Record tag identity gate (nested same-tag structs)
      run: env CCC=target/fastbuild/lccc bash tests/regression/check_record_tag_identity.sh
    - name: Enum tag scope compatibility
      run: env CCC=target/fastbuild/lccc bash tests/regression/check_enum_tag_scope_compat.sh
    - name: Enum layout semantics (widening, packed, struct inheritance, static asserts)
      run: env CCC=target/fastbuild/lccc bash tests/regression/check_enum_layout_semantics.sh
    - name: One-lane FP vector ABI (AUD-VABI-4)
      run: env CCC=target/fastbuild/lccc bash tests/regression/check_ext_vector_one_lane_fp.sh
    - name: Embedded-NUL strlen contract
      run: env CCC=target/fastbuild/lccc bash tests/regression/check_strlen_embedded_nul.sh
    # Enum/enumerator types and `_Alignas(type)` member layout, on x86-64 and
    # i686 (the corpus covers x86-64 only; these layouts differ on i686).
    - name: Enum type and alignas layout fixtures
      run: env CCC=target/fastbuild/lccc bash tests/regression/check_fixture_modes.sh enum_type_semantics.c alignas_type_layout.c
    # Type-dependent `_Static_assert` conditions are decided by sema; false
    # ones must be rejected, not silently accepted.
    - name: Static assertion semantics
      run: env CCC=target/fastbuild/lccc bash tests/regression/check_static_assert_sema.sh
    - name: Volatile destructuring ratchet
      run: |
        python3 scripts/check_volatile_destructuring.py --self-test
        python3 scripts/check_volatile_destructuring.py
    - name: Volatile spin-loop position gate
      run: bash tests/regression/check_volatile_spin_loop.sh
    - name: 64-bit divide bypass assembly contract
      run: bash tests/regression/check_div64_bypass_asm.sh
    - name: Volatile bitfield lowering gate
      run: bash tests/regression/check_volatile_bitfield_split.sh
    - name: Pipefail/SIGPIPE detector
      run: |
        python3 scripts/check_pipefail_sigpipe.py --self-test
        python3 scripts/check_pipefail_sigpipe.py
    - name: Fuzz harness verdict tests
      run: python3 -m unittest discover -s tests/fuzz -p 'test_*.py'
    - name: Verify differential-fuzz engine wiring
      run: python3 scripts/fuzz_diff.py --check-engines
    - name: Expat JUnit comparison contract
      run: python3 tests/workloads/expat-2.8.5/junit_check.py --self-test
    - name: AArch64 dispatcher region contract
      run: python3 -m unittest discover -s tests/aarch64 -p 'test_*.py'
    - name: Differential fuzz smoke (synthetic)
      run: |
        python3 scripts/fuzz_diff.py --engine synthetic --count 4 \
          --lccc target/fastbuild/lccc --refs gcc --opts=-O0,-O2 \
          --seed 20260906
    - name: Verify inline-asm UTF-8 assembly text
      run: |
        python3 scripts/check_inline_asm_utf8.py \
          --lccc target/fastbuild/lccc \
          --expect preserved \
          --json inline-asm-utf8.json
    - name: Verify strict computed-reciprocal codegen
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_strict_computed_recip_codegen.sh
    - name: Verify strict packed coefficient DAG and i686 rounding
      env:
        CCC: target/fastbuild/lccc
        GCC: gcc-16
      run: bash tests/regression/check_strict_packed_dag.sh
    - name: Strict packed reciprocal bitwise oracle
      run: python3 scripts/check_strict_packed_recip.py
    - name: Observable FP environment semantics
      run: bash tests/regression/check_fp_environment.sh
    - name: Verify MachInst narrow-slot window allocation
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_machinst_window_alloc_wide_copy.sh
    - name: Verify over-aligned alloca typed-census admission
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_overalign_typed_census.sh
    - name: Verify peephole parity with and without unwind tables
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_nocfi_peephole_parity.sh
    - name: Verify unwinding through lccc frames (.eh_frame)
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_eh_frame_unwind.sh
    - name: Verify synthesized CFI invariants (corpus, x86-64 + i686)
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_cfi_invariants.sh
    - name: Verify ARX lane-frame latency (vec_arx + arx_vectorize)
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_arx_frame_latency.sh
    - name: Verify latency-driven reassociation (reassoc_lat)
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_reassoc_latency.sh
    - name: Verify COMDAT groups are identified by signature (x86-64 + i686 links)
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_comdat_signature_identity.sh
    - name: Verify segment-qualified declarator codegen
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_segfs_typeof_nosteal.sh
    - name: Verify declaration-level __seg_gs qualifier codegen
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_seg_named_decl_qualifier.sh
    - name: Verify segment-override constant-displacement fold
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_seg_const_offset_fold.sh
    - name: Verify statement-expression address-space declarations do not leak into typeof
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_seg_typeof_stmtexpr_leak.sh
    - name: Verify segment loads land in their home register
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_seg_direct_home.sh
    - name: Verify ISA ceilings (no BMI/AVX escape at x86-64/v2)
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_isa_gate_escape.sh
    - name: Verify kernel boot-path ISA contract (patch + artifact scan)
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_kernel_boot_isa.sh
    - name: Run __seg_gs runtime regression
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_seg_gs_runtime.sh
    - name: Run __seg_gs aggregate copy size sweep
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_seg_copy_sweep.sh
    - name: Run __seg_gs pointee-chain assembly contract
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_seg_pointee_chain_asm.sh
    - name: Run __seg_gs explicit-cast warning and abstract-declarator check
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_seg_cast_warning.sh
    - name: Run __seg_gs declarator-space placement check
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_seg_declarator_space.sh
    - name: Run __seg_gs conversion diagnostics check
      env:
        CCC: target/fastbuild/lccc
        GCC: gcc-16
      run: bash tests/regression/check_seg_conv_diagnostics.sh
    - name: Reject named address spaces on unsupported targets without an ICE
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_seg_target_diagnostics.sh
    - name: Run chroot bind regression
      run: bash tests/regression/check_chroot_bind.sh
    - name: Run kernel-tree deletion-safety regression
      run: bash tests/regression/check_kernel_tree_clear.sh
    - name: Verify observable FP exception ordering
      env:
        CCC: target/fastbuild/lccc
      run: bash tests/regression/check_fp_environment.sh
    needs:
    - build
  backend:
    name: Assembler and linker contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
