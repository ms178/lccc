# Oracle policy: engineering/CI-ORACLE-POLICY.md
# Independent jobs reuse one hash-checked normal compiler artifact.
# Assertion-enabled builds stay isolated; no consumer overwrites another profile.
name: CI
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build once and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_FASTBUILD_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Enable temporary CI swap file
      run: bash scripts/ci_enable_swap.sh
    - name: Compute weekly apt cache key
      id: apt-epoch
      run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
    - name: Cache GCC 16 package downloads
      uses: actions/cache@v6
      with:
        path: ~/.cache/lccc-apt
        key: lccc-apt-debs-v1-${{ runner.os }}-${{ steps.apt-epoch.outputs.week }}
        restore-keys: |
          lccc-apt-debs-v1-${{ runner.os }}-
    - name: Install GCC 16 and i686 C runtime/development files
      env:
        LCCC_CI_APT_ARCHIVE_DIR: /home/runner/.cache/lccc-apt
      run: |
        bash scripts/ci_install_gcc16.sh --multilib
        sudo apt-get install -y --no-install-recommends qemu-user
    - name: Install differential linker oracles
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends mold lld
    - name: Verify GCC 16 C23 oracle
      run: |
        test "$(gcc-16 -dumpfullversion | cut -d. -f1)" = 16
        printf 'int main(void) { return 0; }\n' | gcc-16 -std=c17 -x c -fsyntax-only -
        printf 'int main(void) { return 0; }\n' | gcc-16 -std=c23 -x c -fsyntax-only -
        gcc-16 --version | head -n 1
    - name: Select GCC 16 for legacy oracle invocations
      run: |
        mkdir -p "$RUNNER_TEMP/lccc-oracles"
        ln -s "$(command -v gcc-16)" "$RUNNER_TEMP/lccc-oracles/gcc"
        ln -s "$(command -v g++-16)" "$RUNNER_TEMP/lccc-oracles/g++"
        echo "$RUNNER_TEMP/lccc-oracles" >> "$GITHUB_PATH"
    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    - name: Cache cargo index
      uses: actions/cache@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
    - name: Verify retained evidence hashes
      run: python3 scripts/verify_evidence_hashes.py
    - name: Install gate parsers
      run: sudo apt-get install -y --no-install-recommends python3-yaml
    - name: Build
      run: |
        set +e
        ./scripts/build_lccc_fast.sh 2>&1 | tee "$RUNNER_TEMP/lccc-build.log"
        build_status=${PIPESTATUS[0]}
        set -e
        if [ "$build_status" -ne 0 ]; then
          # Surface the rustc diagnostic tail as a check annotation: the
          # Actions log download endpoint may be unavailable to API clients,
          # but the annotation remains inspectable through the Checks API.
          python3 - "$RUNNER_TEMP/lccc-build.log" <<'PY'
        from pathlib import Path
        import re
        import sys

        text = Path(sys.argv[1]).read_text(errors="replace")
        text = re.sub(chr(27) + r"\[[0-9;]*m", "", text)
        lines = text.splitlines()
        ranges = []
        for index, line in enumerate(lines):
            if re.match(r"^(?:error(?:\[[^]]+\])?:|warning:)", line):
                ranges.append((max(0, index - 2), min(len(lines), index + 32)))
        merged = []
        for start, end in ranges:
            if merged and start <= merged[-1][1]:
                merged[-1] = (merged[-1][0], max(merged[-1][1], end))
            else:
                merged.append((start, end))
        if merged:
            context = []
            for start, end in merged:
                if context:
                    context.append("... omitted log lines ...")
                context.extend(lines[start:end])
        else:
            context = lines[-120:]
        detail = chr(10).join(context)
        if len(detail) > 40000:
            detail = detail[:20000] + chr(10) + "... diagnostic output truncated ..." + chr(10) + detail[-20000:]
        escaped = detail.replace(chr(37), "%25").replace(chr(13), "%0D").replace(chr(10), "%0A")
        print(f"::error title=Rust build diagnostics::{escaped}")
        PY
        fi
        exit "$build_status"
    - name: Run tests
      env:
        CARGO_BUILD_JOBS: '2'
      run: |
        set -euo pipefail
        export RUSTFLAGS="$(cat target/lccc-rustflags)"
        python3 scripts/ci_test_report.py --self-test
        python3 scripts/ci_test_report.py -- cargo test --profile fastbuild --all-targets --locked -j 2
        python3 tests/regression/check_avx512_scalar_witness.py --self-test
        python3 tests/regression/check_avx512_scalar_witness.py
    - name: Package immutable compiler executables
      run: |
        set -euo pipefail
        bins=(target/fastbuild/lccc target/fastbuild/lccc-x86 target/fastbuild/lccc-arm target/fastbuild/lccc-riscv target/fastbuild/lccc-i686 target/fastbuild/lccc-ld)
        git rev-parse HEAD > target/ci-build.commit
        sha256sum "${bins[@]}" > target/ci-build.sha256
        tar -czf lccc-fast.tar.gz "${bins[@]}" target/ci-build.commit target/ci-build.sha256 target/lccc-rustflags
    - uses: actions/upload-artifact@v7
      with:
        name: lccc-fast-${{ github.sha }}
        path: lccc-fast.tar.gz
        if-no-files-found: error
        retention-days: 3
  debug:
    name: Assertion-enabled units and corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_FASTBUILD_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Enable temporary CI swap file
      run: bash scripts/ci_enable_swap.sh
    - name: Compute weekly apt cache key
      id: apt-epoch
      run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
    - name: Cache GCC 16 package downloads
      uses: actions/cache@v6
      with:
        path: ~/.cache/lccc-apt
        key: lccc-apt-debs-v1-${{ runner.os }}-${{ steps.apt-epoch.outputs.week }}
        restore-keys: |
          lccc-apt-debs-v1-${{ runner.os }}-
    - name: Install GCC 16 and i686 C runtime/development files
      env:
        LCCC_CI_APT_ARCHIVE_DIR: /home/runner/.cache/lccc-apt
      run: |
        bash scripts/ci_install_gcc16.sh --multilib
        sudo apt-get install -y --no-install-recommends qemu-user
    - name: Install differential linker oracles
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends mold lld
    - name: Verify GCC 16 C23 oracle
      run: |
        test "$(gcc-16 -dumpfullversion | cut -d. -f1)" = 16
        printf 'int main(void) { return 0; }\n' | gcc-16 -std=c17 -x c -fsyntax-only -
        printf 'int main(void) { return 0; }\n' | gcc-16 -std=c23 -x c -fsyntax-only -
        gcc-16 --version | head -n 1
    - name: Select GCC 16 for legacy oracle invocations
      run: |
        mkdir -p "$RUNNER_TEMP/lccc-oracles"
        ln -s "$(command -v gcc-16)" "$RUNNER_TEMP/lccc-oracles/gcc"
        ln -s "$(command -v g++-16)" "$RUNNER_TEMP/lccc-oracles/g++"
        echo "$RUNNER_TEMP/lccc-oracles" >> "$GITHUB_PATH"
    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    - name: Cache cargo index
      uses: actions/cache@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
    - name: Install gate parsers
      run: sudo apt-get install -y --no-install-recommends python3-yaml
    - name: Run tests (debug-assertions on)
      env:
        CARGO_BUILD_JOBS: '2'
        RUSTFLAGS: -D warnings
      run: python3 scripts/ci_test_report.py -- cargo test --profile fastbuild --all-targets --locked -j 2 --config 'profile.fastbuild.debug-assertions=true'
        --config 'profile.fastbuild.incremental=false' --config 'profile.fastbuild.debug=0'
    - name: Regression corpus (debug-assertions compiler)
      env:
        CCC_VALIDATE_SSA: '1'
        CARGO_BUILD_JOBS: '2'
        RUSTFLAGS: -D warnings
      run: |
        set -o pipefail
        CARGO_INCREMENTAL=0 cargo build --profile fastbuild --bin lccc --locked -j 2 \
          --config 'profile.fastbuild.debug-assertions=true' \
          --config 'profile.fastbuild.incremental=false' \
          --config 'profile.fastbuild.debug=0'
        python3 tests/regression/run_regression.py \
          --lccc target/fastbuild/lccc \
          -j 2 \
          --gcc gcc-16 \
          --json regression-dbgassert-results.json 2>&1 | tee regression-dbgassert-results.log
    - name: Upload regression results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: debug-regression-results
        path: |-
          regression-dbgassert-results.json
          regression-dbgassert-results.log
        if-no-files-found: warn
  corpus:
    name: SSA regression corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_FASTBUILD_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Enable temporary CI swap file
      run: bash scripts/ci_enable_swap.sh
    - name: Compute weekly apt cache key
      id: apt-epoch
      run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
    - name: Cache GCC 16 package downloads
      uses: actions/cache@v6
      with:
        path: ~/.cache/lccc-apt
        key: lccc-apt-debs-v1-${{ runner.os }}-${{ steps.apt-epoch.outputs.week }}
        restore-keys: |
          lccc-apt-debs-v1-${{ runner.os }}-
    - name: Install GCC 16 and i686 C runtime/development files
      env:
        LCCC_CI_APT_ARCHIVE_DIR: /home/runner/.cache/lccc-apt
      run: |
        bash scripts/ci_install_gcc16.sh --multilib
        sudo apt-get install -y --no-install-recommends qemu-user
    - name: Install differential linker oracles
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends mold lld
    - name: Verify GCC 16 C23 oracle
      run: |
        test "$(gcc-16 -dumpfullversion | cut -d. -f1)" = 16
        printf 'int main(void) { return 0; }\n' | gcc-16 -std=c17 -x c -fsyntax-only -
        printf 'int main(void) { return 0; }\n' | gcc-16 -std=c23 -x c -fsyntax-only -
        gcc-16 --version | head -n 1
    - name: Select GCC 16 for legacy oracle invocations
      run: |
        mkdir -p "$RUNNER_TEMP/lccc-oracles"
        ln -s "$(command -v gcc-16)" "$RUNNER_TEMP/lccc-oracles/gcc"
        ln -s "$(command -v g++-16)" "$RUNNER_TEMP/lccc-oracles/g++"
        echo "$RUNNER_TEMP/lccc-oracles" >> "$GITHUB_PATH"
    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    - name: Cache cargo index
      uses: actions/cache@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
    - name: Install gate parsers
      run: sudo apt-get install -y --no-install-recommends python3-yaml
    - uses: actions/download-artifact@v8
      with:
        name: lccc-fast-${{ github.sha }}
    - name: Verify exact compiler build
      run: |
        set -euo pipefail
        tar -xzf lccc-fast.tar.gz
        test "$(cat target/ci-build.commit)" = "$(git rev-parse HEAD)"
        sha256sum -c target/ci-build.sha256
    - name: Record regression environment
      run: |
        {
          echo '== system =='
          uname -a
          cat /etc/os-release || true
          echo '== locale =='
          locale || true
          echo '== Rust =='
          rustc -Vv
          cargo --version
          rustfmt --version
          cargo clippy --version
          echo '== C toolchains =='
          gcc-16 --version | head -1
          g++-16 --version | head -1
          gcc --version | head -1
          as --version | head -1
          ld --version | head -1
          echo '== memory/swap =='
          free -h
          swapon --show
          dpkg-query -W -f='${Package} ${Version}\n' gcc-16 g++-16 gcc-16-multilib g++-16-multilib gcc-multilib libc6-dev-i386 2>/dev/null || echo 'one or more GCC/multilib packages are absent'
          echo '== CPU flags =='
          grep -m1 -E '^flags[[:space:]]*:' /proc/cpuinfo || true
          echo '== tested compiler =='
          sha256sum target/fastbuild/lccc target/fastbuild/lccc-ld
        } | tee ci-regression-environment.txt
    - name: Run regression corpus with SSA validation
      env:
        CCC_VALIDATE_SSA: '1'
      run: |
        set -o pipefail
        python3 tests/regression/run_regression.py \
          --lccc target/fastbuild/lccc \
          -j 2 \
          --gcc gcc-16 \
          --json regression-results.json 2>&1 | tee regression-results.log
    - name: Surface regression failures in annotations
      if: failure()
      run: |
        python3 - <<'PY'
        import json
        from pathlib import Path

        path = Path("regression-results.json")
        if not path.is_file():
            print(
                "::error title=Regression harness::"
                "the corpus gate did not run, so no regression-results.json exists"
                " (an earlier step in this job failed first; that step's own"
                " annotations name it)"
            )
        else:
            report = json.loads(path.read_text(encoding="utf-8"))
            failures = report.get("failures", [])
            if not failures:
                print("::error title=Regression harness::runner failed before reporting a test result")
            for failure in failures:
                name = failure.get("name", "unknown")
                phases = ", ".join(failure.get("phases", [])) or "no phase"
                detail = " ".join(str(failure.get("detail", "")).split())
                detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                print(f"::error title=Regression {name} ({phases})::{detail[:1500]}")
        PY
    - name: Upload regression results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: normal-regression-results
        path: |-
          regression-results.json
          regression-results.log
          ci-regression-environment.txt
        if-no-files-found: warn
    needs:
    - build
  frontend:
    name: Frontend and ABI contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_FASTBUILD_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Enable temporary CI swap file
      run: bash scripts/ci_enable_swap.sh
    - name: Compute weekly apt cache key
      id: apt-epoch
      run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
    - name: Cache GCC 16 package downloads
      uses: actions/cache@v6
      with:
        path: ~/.cache/lccc-apt
        key: lccc-apt-debs-v1-${{ runner.os }}-${{ steps.apt-epoch.outputs.week }}
        restore-keys: |
          lccc-apt-debs-v1-${{ runner.os }}-
    - name: Install GCC 16 and i686 C runtime/development files
      env:
        LCCC_CI_APT_ARCHIVE_DIR: /home/runner/.cache/lccc-apt
      run: |
        set +e
        install_log="$RUNNER_TEMP/gcc16-multilib-install.log"
        bash scripts/ci_install_gcc16.sh --multilib >"$install_log" 2>&1
        install_status=$?
        if (( install_status == 0 )); then
          sudo apt-get install -y --no-install-recommends qemu-user >>"$install_log" 2>&1
          install_status=$?
        fi
        set -e
        cat "$install_log"
        if (( install_status != 0 )); then
          python3 - "$install_log" <<'PY' || true
        from pathlib import Path
        import sys
        lines = [line for line in Path(sys.argv[1]).read_text(errors="replace").splitlines() if line.strip()]
        tail = "\n".join(lines[-30:])[-5000:] or "no install output recorded"
        message = "GCC 16 / i686 provisioning failed: " + tail
        message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
        print("::error title=GCC 16 multilib provisioning::" + message)
        PY
        fi
        exit "$install_status"
    - name: Install differential linker oracles
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends mold lld
    # The ext_vector_type gates compare against Clang 23.1.3 EXACTLY
    # (tests/regression/lib/clang_oracle.sh): GCC has no ext_vector_type and
    # Clang's i386 convention for 8-byte vectors changed between releases,
    # so the runner's default clang is not a reference. The installer pins
    # the official release asset by SHA-256 and extracts only the C front
    # end; the cache key is the installer itself, so a version bump or a
    # digest change refreshes the entry.
    - name: Cache the Clang 23.1.3 oracle
      uses: actions/cache@v6
      with:
        path: ~/.cache/lccc/clang-oracle
        key: lccc-clang-oracle-${{ runner.os }}-${{ hashFiles('scripts/ci_install_clang_oracle.sh') }}
    - name: Install the Clang 23.1.3 oracle
      run: bash scripts/ci_install_clang_oracle.sh
    - name: Verify GCC 16 C23 oracle
      run: |
        test "$(gcc-16 -dumpfullversion | cut -d. -f1)" = 16
        printf 'int main(void) { return 0; }\n' | gcc-16 -std=c17 -x c -fsyntax-only -
        printf 'int main(void) { return 0; }\n' | gcc-16 -std=c23 -x c -fsyntax-only -
        gcc-16 --version | head -n 1
    - name: Select GCC 16 for legacy oracle invocations
      run: |
        mkdir -p "$RUNNER_TEMP/lccc-oracles"
        ln -s "$(command -v gcc-16)" "$RUNNER_TEMP/lccc-oracles/gcc"
        ln -s "$(command -v g++-16)" "$RUNNER_TEMP/lccc-oracles/g++"
        echo "$RUNNER_TEMP/lccc-oracles" >> "$GITHUB_PATH"
    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    - name: Cache cargo index
      uses: actions/cache@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
    - name: Install gate parsers
      run: sudo apt-get install -y --no-install-recommends python3-yaml
    - uses: actions/download-artifact@v8
      with:
        name: lccc-fast-${{ github.sha }}
    - name: Verify exact compiler build
      run: |
        set -euo pipefail
        tar -xzf lccc-fast.tar.gz
        test "$(cat target/ci-build.commit)" = "$(git rev-parse HEAD)"
        sha256sum -c target/ci-build.sha256
    - name: No merge conflict markers
      run: python3 scripts/check_no_conflict_markers.py
    - name: Verify native VEX flag-read architectural controls
      run: bash tests/regression/check_vex_flag_reads.sh
    - name: Verify W2 load->cast fold structure and runtime
      run: bash tests/regression/check_load_cast_fold.sh
    - name: Verify generator-map vectorizer (fires, matches gcc-16, kill switch)
      run: |
        python3 tests/regression/test_generator_map_gate.py
        bash tests/regression/check_generator_map.sh
    - name: Verify benchmark codegen registry and evidence (mock only)
      run: python3 tests/regression/check_benchmark_codegen_registry.py
    - name: Verify local oracle identity and ICX provisioning (offline, mock only)
      run: |
        python3 scripts/test_local_oracles.py
        python3 scripts/test_icx_provision.py
    - name: Verify binary-equivalence attribution contracts
      run: python3 tests/corpus/test_binary_equivalence.py
    - name: Verify benchmark harness oracle and timing contracts
      run: python3 tests/benchmark/test_benchmark_harness.py
    - name: Verify GCC provisioning contracts (mock only)
      run: python3 tests/regression/check_ci_gcc16_provisioning.py
    - name: Verify swap provisioning contracts (mock only)
      run: python3 tests/regression/check_ci_swap_provisioning.py
    - name: Verify manifest Rust-toolchain selection
      run: bash tests/regression/check_rust_toolchain_selector.sh
    - name: Verify restored linker oracle versions
      run: bash tests/regression/check_linker_oracle_versions.sh
    - name: Check driver option contracts
      run: env CCC=target/fastbuild/lccc bash tests/regression/check_driver_option_contract.sh
    - name: Check -fno-builtin constant-fold withdrawal (F1)
      run: env CCC=target/fastbuild/lccc bash tests/regression/check_fno_builtin_folds.sh
    - name: Check the recursion-to-iteration pass
      run: env CCC=target/fastbuild/lccc bash tests/regression/check_rec2iter.sh
    - name: Check FP-contraction parity with GCC
      run: env CCC=target/fastbuild/lccc bash tests/regression/check_fp_contract_parity.sh
    - name: Check builtin_cpu_supports runtime semantics
      run: env CCC=target/fastbuild/lccc bash tests/regression/check_cpu_supports_runtime.sh
    - name: Check GOT-slot references to local symbols
      run: env CCC=target/fastbuild/lccc bash tests/regression/check_got_slot_local_addend.sh
    - name: Check temporary-file symlink isolation
      run: env CCC=target/fastbuild/lccc bash tests/regression/check_temp_symlink.sh
    - name: i686 execution capability policy
      run: bash tests/regression/check_i386_run_policy.sh
    - name: ext_vector_type target widths and invalid element diagnostics
      run: env LCCC_REQUIRE_I686=1 CCC=target/fastbuild/lccc bash tests/regression/check_ext_vector_size.sh
    - name: a9987 salvage and SWAR cast soundness
      run: env LCCC_REQUIRE_I686=1 CCC=target/fastbuild/lccc bash tests/regression/check_a9987_salvage.sh
    - name: ext_vector_type padded layout vs the compiler oracle
      run: env CCC=target/fastbuild/lccc bash tests/regression/check_ext_vector_layout.sh

    - name: Ext-vector rvalue subscript cross-ABI
      run: env CCC=target/fastbuild/lccc bash tests/regression/check_ext_vector_rvalue_subscript.sh
    - name: ext_vector_type cross-compiler by-value ABI
      run: |
        set -o pipefail
        env CCC=target/fastbuild/lccc bash tests/regression/check_ext_vector_abi.sh 2>&1 |
          tee "$RUNNER_TEMP/ext-vector-abi.log"
    - name: ext_vector_type by-value ABI grid vs the Clang 23.1.3 oracle
      run: |
        set -o pipefail
        env LCCC_REQUIRE_I686=1 CCC=target/fastbuild/lccc bash tests/regression/check_ext_vector_abi_grid.sh 2>&1 |
          tee "$RUNNER_TEMP/ext-vector-abi-grid.log"
    - name: ext_vector_type by-value ABI under the AVX ABI level vs the Clang 23.1.3 oracle
      run: |
        set -o pipefail
        env CCC=target/fastbuild/lccc bash tests/regression/check_ext_vector_abi_avx.sh 2>&1 |
          tee "$RUNNER_TEMP/ext-vector-abi-avx.log"
    - name: Surface ext-vector ABI failures in annotations
      if: failure()
      run: |
        for log in ext-vector-abi ext-vector-abi-grid ext-vector-abi-avx; do
          [ -s "$RUNNER_TEMP/$log.log" ] || continue
