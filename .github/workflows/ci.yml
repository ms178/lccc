    - name: vector scalar conversion diagnostics
      run: env CCC=target/fastbuild/lccc bash tests/regression/check_vector_scalar_conversions.sh
    - name: Subscript constraint diagnostics
      run: env CCC=target/fastbuild/lccc python3 tests/regression/check_subscript_diagnostics.py
    - name: Cross-target intrinsic trap
      run: |
        env CCC=target/fastbuild/lccc \
            CCC_ARM=target/fastbuild/lccc-arm \
