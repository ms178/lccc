# TEMPORARY transport workflow (removed from the branch once consumed).
#
# The Arena sandbox (Debian 12, no route to deb.debian.org / ftp.gnu.org /
# apt.llvm.org) needs the research-harness toolchain upgrades the project
# policy pins: GCC 16.2 (verdict oracle for ~20 gates), binutils 2.47
# (GAS/objdump oracle pair via scripts/ensure_gas_247.sh), 32-bit glibc for
# the -m32 legs, valgrind for callgrind oracles, PyYAML for workflow lint,
# and mold 2.42.1. GitHub runners have full internet; this job builds inside
# a debian:12 container so every binary matches the sandbox ABI, then pushes
# the payload as an ORPHAN TAG (harness-cache-1); no branch is touched.
name: harness-cache
on:
  workflow_dispatch: {}
  push:
    branches: ["arena/ff2b91ca-lccc"]
    paths: [".github/workflows/harness-cache.yml"]
permissions:
  contents: write
concurrency:
  group: harness-cache
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:12
    timeout-minutes: 350
    steps:
      - name: Container deps
        run: |
          set -euxo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential curl ca-certificates xz-utils flex bison file \
            libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev libzstd-dev texinfo \
            gcc-multilib g++-multilib libc6-dev-i386 cmake ninja-build git \
            libssl-dev
      - name: Build GCC 16.2 (bookworm ABI, multilib, stripped)
        run: |
          set -euxo pipefail
          cd /tmp
          curl -sSf --retry 3 -O https://ftp.gnu.org/gnu/gcc/gcc-16.2.0/gcc-16.2.0.tar.xz \
            || { curl -s https://ftp.gnu.org/gnu/gcc/ | grep -oE 'gcc-16\.[0-9.]+/' | sort -u; exit 1; }
          tar xf gcc-16.2.0.tar.xz
          mkdir gcc-build && cd gcc-build
          ../gcc-16.2.0/configure --prefix=/opt/gcc-16 --program-suffix=-16 \
            --enable-languages=c,c++ --disable-bootstrap --disable-nls \
            --disable-libsanitizer --disable-werror --with-system-zlib
          make -j"$(nproc)"
          make install-strip
          /opt/gcc-16/bin/gcc-16 --version
          echo 'int main(void){return 0;}' > t.c
          /opt/gcc-16/bin/gcc-16 -m32 t.c -o t32 && file t32
          /opt/gcc-16/bin/gcc-16 t.c -o t64 && ./t64
      - name: Fetch binutils 2.47 tarball (pin-checked)
        run: |
          set -euxo pipefail
          cd /tmp
          curl -sSf --retry 3 -O https://ftp.gnu.org/gnu/binutils/binutils-2.47.tar.xz
          echo "154ab23b60070e8f27013c22977f1129425d67d1e8acd6e13010e617811e4cff  binutils-2.47.tar.xz" | sha256sum -c -
      - name: Build mold 2.42.1
        run: |
          set -euxo pipefail
          cd /tmp
          git clone --depth 1 -b v2.42.1 https://github.com/rui314/mold.git
          cd mold
          # Research preset: x86-64/i686 targets only when the build system
          # exposes a target list (saves build time; policy request).
          extra=""
          if grep -qE 'MOLD_TARGETS' CMakeLists.txt; then
            extra="-DMOLD_TARGETS=X86_64;I386"
          fi
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release $extra
          cmake --build build -j"$(nproc)"
          strip build/mold
          ./build/mold --version
      - name: Download bookworm debs (32-bit glibc, valgrind, PyYAML)
        run: |
          set -euxo pipefail
          mkdir -p /tmp/debs && cd /tmp/debs
          ok=1
          for p in valgrind libc6-dbg python3-yaml gcc-multilib gcc-12-multilib \
                   g++-multilib g++-12-multilib libc6-dev-i386 libc6-i386 \
                   lib32gcc-12-dev lib32gcc-s1 lib32stdc++6 lib32stdc++-12-dev \
                   lib32gomp1 lib32itm1 lib32atomic1 lib32ubsan1 lib32quadmath0 \
                   lib32asan8 libx32gcc-12-dev libx32gcc-s1 libx32stdc++6; do
            apt-get download "$p" || echo "MISS $p" >> miss.txt
          done
          for must in libc6-dev-i386 libc6-i386 lib32gcc-12-dev valgrind python3-yaml; do
            ls "$must"_*.deb || ok=0
          done
          [ "$ok" = 1 ]
          cat miss.txt || true
      - name: Package and push as orphan tag harness-cache-1
        run: |
          set -euxo pipefail
          mkdir -p /cache/chunks
          export XZ_OPT='-T0 -6'
          tar -C /opt -cJf /cache/gcc-16-bookworm-x86_64.tar.xz gcc-16
          tar -C /tmp -cJf /cache/debs-bookworm.tar.xz debs
          cp /tmp/binutils-2.47.tar.xz /cache/
          cp /tmp/mold/build/mold /cache/mold-2.42.1-x86_64
          cd /cache
          sha256sum gcc-16-bookworm-x86_64.tar.xz debs-bookworm.tar.xz \
            binutils-2.47.tar.xz mold-2.42.1-x86_64 > chunks/MANIFEST.sha256
          for f in gcc-16-bookworm-x86_64.tar.xz debs-bookworm.tar.xz \
                   binutils-2.47.tar.xz mold-2.42.1-x86_64; do
            split -b 94371840 -d -a 2 "$f" "chunks/$f.part"
          done
          ls -l chunks/
          cd chunks
          git init -q .
          git config user.name 'harness-cache'
          git config user.email 'harness-cache@local'
          git add -A
          git commit -q -m 'bookworm harness toolchain payload (transport only)'
          git tag harness-cache-1
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            refs/tags/harness-cache-1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
