name: Targeted compiler research

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/compiler-research.yml']
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline commit or main ref to archive and build (never checked out over the candidate)
        required: true
        default: main
      cases:
        description: Comma-separated canonical workloads (all selects the full corpus)
        required: false
        default: "nbody,hot_web_loop,byte_load_reassembly,expat_siphash24,double_reduction,spectral_norm,matmul,binary_trees,expat_xml_scan,zstd_count,f32_sse1_map,fp32_product_map"
      rounds:
        description: Paired native rounds, excluding three warm-ups
        required: true
        default: "31"

permissions:
  contents: read

concurrency:
  group: compiler-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    # Opt-in research: manual, or a PR explicitly changing this definition.
    name: Same-host portable/native runtime and Callgrind
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: "2"
      RUSTFLAGS: -D warnings
      BASELINE_REF: ${{ inputs.baseline_ref || github.event.pull_request.base.sha || 'main' }}
      RESEARCH_CASES: ${{ inputs.cases || 'nbody,hot_web_loop,byte_load_reassembly,expat_siphash24,double_reduction,spectral_norm,matmul,binary_trees,expat_xml_scan,zstd_count,f32_sse1_map,fp32_product_map' }}
      RESEARCH_ROUNDS: ${{ inputs.rounds || '31' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Activate swap before compiler builds and instrumentation
        run: bash scripts/ci_enable_swap.sh
      - name: Install and identify instrumentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind python3-yaml
          bash scripts/ci_install_gcc16.sh --base
          valgrind --version
          gcc-16 --version
          bash scripts/ci_install_clang_oracle.sh
          bash scripts/ensure_gas_247.sh x86_64-linux-gnu "$RUNNER_TEMP/gas-247"
          echo "$RUNNER_TEMP/gas-247/bin" >> "$GITHUB_PATH"
          # Use an identified current linker, not the image's default GNU ld.
          git fetch --depth=1 origin tag harness-cache-1
          mkdir -p "$RUNNER_TEMP/current-linker"
          git show harness-cache-1:mold-2.42.1-x86_64.part00 > "$RUNNER_TEMP/current-linker/ld"
          echo "86b918f8af9444aed086ea73b593b88e910d49829d2cae979cbb84509b64dc76  $RUNNER_TEMP/current-linker/ld" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/current-linker/ld"
          echo "$RUNNER_TEMP/current-linker" >> "$GITHUB_PATH"
          rustc -Vv
          cargo --version
          rustfmt --version
          cargo clippy --version
      - name: Build candidate and independently archived main baseline
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/research "$RUNNER_TEMP/research-main"
          git fetch --no-tags -- origin "$BASELINE_REF"
          git rev-parse FETCH_HEAD > results/research/baseline.sha
          git rev-parse HEAD > results/research/candidate.sha
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/research-main"
          cargo build --profile fastbuild --locked --bin lccc -j 2 \
            --config 'target.x86_64-unknown-linux-gnu.linker="gcc-16"'
          (
            cd "$RUNNER_TEMP/research-main"
            CARGO_TARGET_DIR="$RUNNER_TEMP/research-main-target" \
              cargo build --profile fastbuild --locked --bin lccc -j 2 \
              --config 'target.x86_64-unknown-linux-gnu.linker="gcc-16"'
          )
          sha256sum target/fastbuild/lccc "$RUNNER_TEMP/research-main-target/fastbuild/lccc" \
            > results/research/compiler-binaries.sha256
      - name: Same-host before/after/vendor portable and native comparisons
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RESEARCH_CASES" == all ]]; then RESEARCH_CASES=""; fi
          [[ "$RESEARCH_ROUNDS" =~ ^[0-9]+$ ]] && (( RESEARCH_ROUNDS >= 9 && RESEARCH_ROUNDS <= 101 ))
          as --version | head -1
          ld --version
          for profile in portable native; do
            flags=()
            if [[ "$profile" == native ]]; then flags+=(--cflag=-march=native); fi
            python3 tests/benchmark/run_benchmarks.py \
              --lccc target/fastbuild/lccc --compilers lccc,gcc,clang \
              --gcc gcc-16 --clang "$CLANG" \
              --candidate "before=$RUNNER_TEMP/research-main-target/fastbuild/lccc" \
              --opt=-O2 --cflag=-std=gnu17 "${flags[@]}" \
              --only "$RESEARCH_CASES" --reps "$RESEARCH_ROUNDS" --warmup 3 \
              --cpu auto --no-pmu-probe --strict \
              --artifact-dir "results/research/$profile-artifacts" \
              --json "results/research/$profile.json" \
              --markdown "results/research/$profile.md"
          done
      - name: Publish CPU-specific paired results through the checks API
        if: always()
        run: python3 scripts/publish_cpu_runtime_evidence.py results/research
      - name: Calibrated short-kernel entry timing without exec startup
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          for profile in portable native; do
            flags="-O2 -std=gnu17"
            if [[ "$profile" == native ]]; then flags+=" -march=native"; fi
            python3 scripts/benchmark_native_batched.py \
              --compiler lccc=target/fastbuild/lccc \
              --compiler "before=$RUNNER_TEMP/research-main-target/fastbuild/lccc" \
              --compiler gcc=gcc-16 --compiler "clang=$CLANG" --reference before \
              --gcc gcc-16 --flags="$flags" --cpu auto \
              --only byte_load_reassembly,matmul,zstd_count \
              --rounds "$RESEARCH_ROUNDS" --seconds .2 \
              --out "results/research/$profile-batched"
          done
      - name: Publish startup-excluded results and alias disclosure
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          for profile in ('portable', 'native'):
              path = Path('results/research') / (profile + '-batched') / 'results.json'
              if path.exists():
                  report = json.loads(path.read_text())
                  for row in report['rows']:
                      text = json.dumps({'profile': profile, 'name': row['name'],
                                         'complete': report['complete'],
                                         'measured_as': row['measured_as'],
                                         'comparisons': row['comparisons']}, separators=(',', ':'))
                      # Samples remain in the artifact; do not overflow annotation limits.
                      value = json.loads(text)
                      for result in value['comparisons'].values():
                          result.pop('paired_ratios', None)
                      text = json.dumps(value, separators=(',', ':'))
                      text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::notice title=Startup-excluded CPU runtime::' + text)
          PYCODE
      - name: Correctness-gated bounded Callgrind main/candidate A-B
        timeout-minutes: 8
        run: |
          if [[ "$RESEARCH_CASES" == all ]]; then RESEARCH_CASES=""; fi
          python3 scripts/callgrind_corpus.py \
            --mine target/fastbuild/lccc \
            --ref "$RUNNER_TEMP/research-main-target/fastbuild/lccc" \
            --gcc-include-command gcc-16 \
            --only "$RESEARCH_CASES" --out results/research/callgrind-main
      - name: Supplementary Callgrind against identified native GCC
        timeout-minutes: 8
        # Identified native GCC16; this is not measured execution of CE binaries.
        run: |
          if [[ "$RESEARCH_CASES" == all ]]; then RESEARCH_CASES=""; fi
          python3 scripts/callgrind_corpus.py \
            --mine target/fastbuild/lccc --ref gcc-16 --gcc-include-command gcc-16 \
            --only "$RESEARCH_CASES" --out results/research/callgrind-gcc
      - name: Publish bounded measurement verdicts and full-report hashes
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path('results/research')
          root.mkdir(parents=True, exist_ok=True)
          summary = {'metric': 'bounded simulated Ir; NOT native cycles or universal superiority',
                     'head': (root / 'candidate.sha').read_text().strip() if (root / 'candidate.sha').exists() else None,
                     'baseline': (root / 'baseline.sha').read_text().strip() if (root / 'baseline.sha').exists() else None,
                     'artifact': 'compiler-research', 'callgrind': {}}
          from tests.benchmark.run_benchmarks import BENCHMARKS
          selected = (set(os.environ['RESEARCH_CASES'].split(','))
                      if os.environ['RESEARCH_CASES'] not in ('', 'all') else {b.name for b in BENCHMARKS})
          for arm in ('main', 'gcc'):
              path = root / f'callgrind-{arm}' / 'index.json'
              if not path.exists():
                  summary['callgrind'][arm] = {'available': False}
                  continue
              raw = path.read_bytes()
              data = json.loads(raw)
              complete = data['complete'] and not data['failures'] and set(data['results']) == selected
              summary['callgrind'][arm] = {
                  'complete': complete,
                  'report_sha256': hashlib.sha256(raw).hexdigest(),
                  'ratios': {name: row['metrics']['ir_ratio'] for name, row in data['results'].items()},
                  'failed_cases': [row['name'] for row in data['failures']],
              }
          text = json.dumps(summary, separators=(',', ':'))
          assert len(text.encode()) <= 3900, 'checks API annotation budget exceeded'
          escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::notice title=Compiler research evidence::{escaped}')
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('```json\n' + json.dumps(summary, indent=2) + '\n```\n')
          PY
      - name: Retain all identities, flags, counters, assembly and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compiler-research
          path: results/research/
          if-no-files-found: warn
