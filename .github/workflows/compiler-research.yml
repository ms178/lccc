name: Targeted compiler research

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/compiler-research.yml'
      - 'scripts/ci_build_llvm_slp_oracles.sh'
      - 'scripts/test_llvm_slp_oracle_builder.py'
      - 'src/passes/vec_ssa.rs'
      - 'src/passes/slp_vectorizer.rs'
      - 'src/passes/vectorize.rs'
      - 'src/passes/byte_load.rs'
      - 'src/passes/join_store_forward.rs'
      - 'src/backend/global_alignment.rs'
      - 'src/backend/x86/codegen/peephole/passes/self_zext.rs'
      - 'scripts/publish_cpu_runtime_evidence.py'
      - 'include/emmintrin.h'
      - 'include/avxintrin.h'
      - 'tests/regression/native_vector_bitcasts.c'
      - 'tests/regression/check_native_vector_bitcasts.py'
  workflow_dispatch:
    inputs:
      refresh_toolchain_cache:
        description: Also publish Rust 1.99.1 and Clang 23.1.4 hash-cache assets
        type: boolean
        default: false
      patched_llvm_slp:
        description: Build LLVM PR 227303 and its exact base for paired LightPixel timings (slow, opt-in)
        type: boolean
        default: false
      baseline_ref:
        description: Baseline commit or main ref to archive and build (never checked out over the candidate)
        required: true
        default: main
      cases:
        description: Comma-separated canonical workloads (all selects the full corpus)
        required: false
        default: "nbody,hot_web_loop,byte_load_reassembly,expat_siphash24,double_reduction,spectral_norm,matmul,binary_trees,expat_xml_scan,zstd_count,f32_sse1_map,fp32_product_map,fp64_product_map"
      rounds:
        description: Paired native rounds, excluding three warm-ups
        required: true
        default: "31"

permissions:
  contents: read

# Keep a running measurement experiment when a follow-up commit is pushed.
concurrency:
  group: compiler-research-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  cache-contract:
    name: Restore and verify the reviewed Rust and Clang cache
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test controlled LLVM builder and cache refusal paths
        run: python3 scripts/test_llvm_slp_oracle_builder.py
      - name: Verify archive hashes, secure extraction and exact tool identities
        run: python3 scripts/restore_toolchain_cache.py --prefix "$RUNNER_TEMP/reviewed-oracles"
  toolchain-cache:
    if: ${{ inputs.refresh_toolchain_cache }}
    name: Publish hash-verified Rust and Clang cache
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Install exact Clang release from its pinned upstream digest
        env:
          LCCC_CLANG_ORACLE_PREFIX: ${{ runner.temp }}/clang-23.1.4
        run: bash scripts/ci_install_clang_oracle.sh
      - name: Publish immutable assets without changing transport tags
        env:
          GH_TOKEN: ${{ github.token }}
          LCCC_CLANG_ORACLE_PREFIX: ${{ runner.temp }}/clang-23.1.4
        run: python3 scripts/publish_toolchain_cache.py "$RUNNER_TEMP/toolchain-cache"
      - uses: actions/upload-artifact@v6
        with:
          name: toolchain-cache-lock
          path: ${{ runner.temp }}/toolchain-cache/toolchain-cache.json
          if-no-files-found: error
  evidence:
    # Opt-in research: manual, or a PR touching watched compiler/research inputs.
    name: Same-host portable/native runtime and Callgrind
    runs-on: ubuntu-24.04
    # Twenty workloads times two profiles, then four same-compiler controls and
    # two Callgrind sweeps. The measurements are strictly correctness-gated,
    # so the budget must cover the full selection instead of truncating it.
    timeout-minutes: 150
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: "2"
      RUSTFLAGS: -D warnings
      BASELINE_REF: ${{ inputs.baseline_ref || github.event.pull_request.base.sha || 'main' }}
      # Cover P-core and E-core outliers independently identified by the
      # hybrid report, including long-running branch, allocator and string
      # workloads. A dispatch can select any registry subset or the corpus.
      RESEARCH_CASES: ${{ inputs.cases || (github.event_name == 'pull_request' && 'zlib_ng_slide_hash,linux_list_sort,sqlite_vdbe_serial,byte_load_reassembly,f32_sse1_map,fp32_product_map,fp64_product_map,zlib_ng_compare256,arith_loop,sqlite_varint,hot_web_loop,sha256_transform,glibc_strstr,binary_trees,expat_xml_scan,strlen_bench,loop_patterns,mandelbrot,aarch64_select_patterns,qsort' || 'nbody,hot_web_loop,byte_load_reassembly,expat_siphash24,double_reduction,spectral_norm,matmul,binary_trees,expat_xml_scan,zstd_count,f32_sse1_map,fp32_product_map,fp64_product_map') }}
      RESEARCH_ROUNDS: ${{ inputs.rounds || (github.event_name == 'pull_request' && '9' || '31') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Activate swap before compiler builds and instrumentation
        run: bash scripts/ci_enable_swap.sh
      - name: Install and identify instrumentation tools
        run: |
          python3 scripts/ci_test_report.py -- bash scripts/ci_prepare_research_tools.sh
      - name: Provision authenticated ICX 2026.2 for paired comparisons
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p results/research
          binary=$(bash scripts/ensure_icx_2026.sh "$RUNNER_TEMP/research-icx-2026.2")
          test -x "$binary"
          echo "ICX=$binary" >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/research-icx-2026.2/.lccc-icx.json" results/research/icx-install.json
          "$binary" --version | tee results/research/icx-version.txt
          sha256sum "$binary" > results/research/icx-binary.sha256
      - name: Build candidate and independently archived main baseline
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/research "$RUNNER_TEMP/research-main"
          cp "$LCCC_SYSROOT/runtime.json" results/research/gcc-runtime.json
          git fetch --no-tags -- origin "$BASELINE_REF"
          git rev-parse FETCH_HEAD > results/research/baseline.sha
          git rev-parse HEAD > results/research/candidate.sha
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/research-main"
          cargo build --profile fastbuild --locked --bin lccc -j 2 \
            --config 'target.x86_64-unknown-linux-gnu.linker="gcc-16"'
          # A paired comparison needs a "before" compiler. When the base
          # commit itself does not build (a merge skew on main, as with the
          # base of #1025), fail with that diagnosis instead of a bare cargo
          # exit status that reads like a candidate failure.
          if ! (
            cd "$RUNNER_TEMP/research-main"
            CARGO_TARGET_DIR="$RUNNER_TEMP/research-main-target" \
              cargo build --profile fastbuild --locked --bin lccc -j 2 \
              --config 'target.x86_64-unknown-linux-gnu.linker="gcc-16"'
          ); then
            base=$(cat results/research/baseline.sha)
            echo "::error title=Research baseline does not compile::baseline $base ($BASELINE_REF) failed to build while the candidate built; the paired before/after comparison cannot run until the base compiles (repair main or rebase)."
            exit 1
          fi
          sha256sum target/fastbuild/lccc "$RUNNER_TEMP/research-main-target/fastbuild/lccc" \
            > results/research/compiler-binaries.sha256
      - name: Dual-mode native AVX API contracts with exact current tools
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcc-16 -dumpfullversion)" = 16.2.0
          python3 tests/regression/check_gnu_builtin_diagnostics.py --lccc target/fastbuild/lccc --gcc gcc-16
          for family in avx_vtest_sign_bits avx2_widen_native gnu_native_builtin_types gnu_byte_shift_counts gnu_builtin_scalar_conversions native_packed_scalar_shift_counts; do
            python3 scripts/ci_test_report.py -- \
              python3 tests/regression/run_regression.py \
                --lccc target/fastbuild/lccc --gcc gcc-16 -j 2 \
                --filter "$family" --json "results/research/$family.json"
          done
          python3 - <<'PYCONTRACT'
          import json
          from pathlib import Path
          for family in ('avx_vtest_sign_bits', 'avx2_widen_native', 'gnu_native_builtin_types', 'gnu_byte_shift_counts', 'gnu_builtin_scalar_conversions', 'native_packed_scalar_shift_counts'):
              report = json.loads(Path(f'results/research/{family}.json').read_text())
              expected = {'total': 2, 'passed': 2, 'failed': 0, 'skipped_compare': 0, 'skipped_run': 0}
              actual = {key: report[key] for key in expected}
              if actual != expected:
                  raise SystemExit(f'{family}: required real amd64+i686 execution, got {actual}')
              print(f'::notice title=Native AVX dual-mode execution::{family}: {json.dumps(actual, sort_keys=True)}; GCC 16.2.0')
          PYCONTRACT
      - name: Public native SIMD type and cross-compiler ABI contracts
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_test_report.py -- \
            python3 tests/regression/run_regression.py \
              --lccc target/fastbuild/lccc --gcc gcc-16 -j 2 \
              --filter public_simd_native_types --json results/research/public-simd-types.json
          python3 - <<'PYTYPES'
          import json
          from pathlib import Path
          report = json.loads(Path('results/research/public-simd-types.json').read_text())
          expected = {'total': 2, 'passed': 2, 'failed': 0, 'skipped_compare': 0, 'skipped_run': 0}
          actual = {key: report[key] for key in expected}
          if actual != expected:
              raise SystemExit(f'public SIMD types require real dual-mode execution: {actual}')
          PYTYPES
          python3 scripts/ci_test_report.py -- \
            python3 tests/regression/check_public_simd_abi.py --gcc gcc-16
      - name: Early native floating-point comparison control
        if: ${{ contains(env.RESEARCH_CASES, 'mandelbrot') || env.RESEARCH_CASES == 'all' }}
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          out=results/research/fp-early
          mkdir -p "$out"
          # Keep the default-contract outcome, including mismatches. The full
          # paired run below remains the authoritative strict gate.
          if python3 tests/benchmark/run_benchmarks.py \
              --lccc target/fastbuild/lccc --compilers lccc,gcc,clang,icx \
              --gcc gcc-16 --clang "$CLANG" --icx "$ICX" \
              --candidate "before=$RUNNER_TEMP/research-main-target/fastbuild/lccc" \
              --opt=-O2 --cflag=-std=gnu17 --cflag=-march=native \
              --only mandelbrot --cpu auto --skip-perf --no-pmu-probe --strict \
              --artifact-dir "$out/default-artifacts" --json "$out/default.json" \
              > "$out/default.log" 2>&1; then
            echo 0 > "$out/default.exit"
          else
            echo "$?" > "$out/default.exit"
          fi
          test -s "$out/default.json"
          # Diagnostic only: a control that reproduces a vendor-only difference
          # must not abort the timing runs that follow. The paired strict gate
          # below remains authoritative for correctness.
          python3 scripts/diagnose_cpu_fp_mismatch.py \
            --report "$out/default.json" --original-artifacts "$out/default-artifacts" \
            --out "$out/contract-off" \
            --lccc target/fastbuild/lccc --gcc gcc-16 --clang "$CLANG" --icx "$ICX" \
            --candidate "before=$RUNNER_TEMP/research-main-target/fastbuild/lccc" \
            || echo "pre-timing diagnostic recorded a mismatch control; the paired gate below decides"
      - name: Same-host before/after/vendor portable and native comparisons
        id: paired_runtime
        timeout-minutes: 75
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RESEARCH_CASES" == all ]]; then RESEARCH_CASES=""; fi
          [[ "$RESEARCH_ROUNDS" =~ ^[0-9]+$ ]] && (( RESEARCH_ROUNDS >= 9 && RESEARCH_ROUNDS <= 101 ))
          as --version | head -1
          ld --version
          # Same compiler, same inputs: isolate the small floating-point
          # map-unroll policy rather than attributing all differences to it.
          # The wrapper and its environment are retained with the receipts.
          cat > results/research/rolled-compiler <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          export CCC_NO_MAP_FP_UNROLL=1
          exec "$(dirname -- "$0")/../../target/fastbuild/lccc" "$@"
          SH
          chmod +x results/research/rolled-compiler
          for profile in portable native; do
            flags=()
            if [[ "$profile" == native ]]; then flags+=(--cflag=-march=native); fi
            python3 tests/benchmark/run_benchmarks.py \
              --lccc target/fastbuild/lccc --compilers lccc,gcc,clang,icx \
              --gcc gcc-16 --clang "$CLANG" --icx "$ICX" \
              --candidate "before=$RUNNER_TEMP/research-main-target/fastbuild/lccc" \
              --candidate "rolled=$GITHUB_WORKSPACE/results/research/rolled-compiler" \
              --opt=-O2 --cflag=-std=gnu17 "${flags[@]}" \
              --only "$RESEARCH_CASES" --reps "$RESEARCH_ROUNDS" --warmup 3 \
              --cpu auto --no-pmu-probe --strict \
              --artifact-dir "results/research/$profile-artifacts" \
              --json "results/research/$profile.json" \
              --markdown "results/research/$profile.md"
          done
      - name: Diagnose native floating-point output differences
        if: ${{ failure() && steps.paired_runtime.outcome == 'failure' }}
        timeout-minutes: 8
        run: |
          python3 scripts/diagnose_cpu_fp_mismatch.py \
            --report results/research/native.json \
            --original-artifacts results/research/native-artifacts \
            --out results/research/fp-mismatch-control \
            --lccc target/fastbuild/lccc --gcc gcc-16 --clang "$CLANG" --icx "$ICX" \
            --candidate "before=$RUNNER_TEMP/research-main-target/fastbuild/lccc" \
            --candidate "rolled=$GITHUB_WORKSPACE/results/research/rolled-compiler"
      - name: Publish CPU-specific paired results through the checks API
        if: always()
        run: python3 scripts/publish_cpu_runtime_evidence.py results/research --expected-cases "$RESEARCH_CASES" --expected-compilers lccc,before,gcc,clang,icx,rolled
      - name: Same-compiler list-merge join-forwarding experiment
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RESEARCH_CASES" != all && ",$RESEARCH_CASES," != *,linux_list_sort,* ]]; then
            echo 'list-sort not selected; no join-forwarding timing requested'
            exit 0
          fi
          cat > results/research/join-off-compiler <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          export CCC_DISABLE_PASSES=join_store_forward
          exec "$(dirname -- "$0")/../../target/fastbuild/lccc" "$@"
          SH
          chmod +x results/research/join-off-compiler
          for profile in portable native; do
            flags="-O2 -std=gnu17"
            if [[ "$profile" == native ]]; then flags+=" -march=native"; fi
            out="results/research/$profile-join-ab"
            python3 scripts/benchmark_native_batched.py \
              --compiler lccc=target/fastbuild/lccc \
              --compiler "join_off=$GITHUB_WORKSPACE/results/research/join-off-compiler" \
              --compiler gcc=gcc-16 --reference join_off \
              --gcc gcc-16 --flags="$flags" --cpu auto \
              --only linux_list_sort --rounds "$RESEARCH_ROUNDS" --seconds .2 \
              --out "$out"
            for arm in lccc join_off; do
              objdump -d "$out/linux_list_sort/$arm/original.o" > "$out/$arm.dis"
            done
          done
          python3 - <<'PYJOIN'
          import json
          from pathlib import Path
          from scripts.publish_cpu_runtime_evidence import focused_excerpt
          parts = []
          for profile in ('portable', 'native'):
              root = Path('results/research') / (profile + '-join-ab')
              report = json.loads((root / 'results.json').read_text())
              row, = report['rows']
              assert report['complete'] and report['pinning']['applied']
              assert row['name'] == 'linux_list_sort'
              ratios = {key: {k: v for k, v in value.items() if k != 'paired_ratios'}
                        for key, value in row['comparisons'].items()}
              parts.append(json.dumps({'profile': profile, 'reference': report['reference'],
                                       'rounds': report['rounds'], 'ratios': ratios}, separators=(',', ':')))
              for arm in ('lccc', 'join_off'):
                  text = focused_excerpt((root / (arm + '.dis')).read_text(),
                                         'merge_and_count', 650, 'first-loop')
                  parts.append(f'=== {profile}/{arm} ===\n{text}')
          text = '\n'.join(parts)
          if len(text.encode()) > 3900:
              raise SystemExit('join-forwarding notice exceeds byte budget')
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=Same-compiler list-merge join-forwarding A-B::' + text)
          PYJOIN
      - name: Same-compiler fallthrough zero-extension ablation
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cat > results/research/no-fallthrough-compiler <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          export CCC_NO_SELF_ZEXT_FALLTHROUGH=1
          exec "$(dirname -- "$0")/../../target/fastbuild/lccc" "$@"
          SH
          chmod +x results/research/no-fallthrough-compiler
          for profile in portable native; do
            flags=()
            if [[ "$profile" == native ]]; then flags+=(--cflag=-march=native); fi
            python3 tests/benchmark/run_benchmarks.py \
              --lccc target/fastbuild/lccc --compilers lccc,gcc --gcc gcc-16 \
              --candidate "no_fallthrough=$GITHUB_WORKSPACE/results/research/no-fallthrough-compiler" \
              --opt=-O2 --cflag=-std=gnu17 "${flags[@]}" --only zlib_ng_slide_hash \
              --reps "$RESEARCH_ROUNDS" --warmup 3 --cpu auto --no-pmu-probe --strict \
              --artifact-dir "results/research/$profile-zext-artifacts" \
              --json "results/research/$profile-zext.json"
          done
          python3 scripts/callgrind_corpus.py \
            --mine target/fastbuild/lccc --ref "$GITHUB_WORKSPACE/results/research/no-fallthrough-compiler" \
            --gcc-include-command gcc-16 --target-flags="" --only zlib_ng_slide_hash \
            --out results/research/callgrind-zext
          python3 - <<'PYZEXT'
          import json
          from pathlib import Path
          root = Path('results/research')
          summary = {'metric': 'paired elapsed time; bounded simulated Ir is not native cycles', 'profiles': {}}
          def ratio_view(value):
              return {'median': value['median'], 'ci95': value['median_ci95_bootstrap'], 'n': value['n']}
          for profile in ('portable', 'native'):
              report = json.loads((root / f'{profile}-zext.json').read_text())
              assert report['metadata']['pinning']['applied']
              row = report['benchmarks'][0]
              assert row['name'] == 'zlib_ng_slide_hash'
              for arm in ('lccc', 'gcc', 'no_fallthrough'):
                  assert all(row['correctness'][arm][key] for key in
                             ('all_runs_successful', 'matches_baseline', 'stable_within_compiler'))
              summary['profiles'][profile] = {
                  'cpu': report['metadata']['cpu_models'],
                  'after_over_disabled': ratio_view(row['ratios_from_lccc']['no_fallthrough']),
                  'after_over_gcc': ratio_view(row['ratios_from_lccc']['gcc']),
                  'identical_binaries': row['compile']['lccc']['binary_sha256'] == row['compile']['no_fallthrough']['binary_sha256'],
              }
          cg = json.loads((root / 'callgrind-zext/index.json').read_text())
          assert cg['complete'] and not cg['failures'] and set(cg['results']) == {'zlib_ng_slide_hash'}
          summary['bounded_ir_after_over_disabled'] = cg['results']['zlib_ng_slide_hash']['metrics']['ir_ratio']
          text = json.dumps(summary, separators=(',', ':'))
          assert len(text.encode()) <= 3900
          print('::notice title=Zero-extension ablation::' + text)
          (root / 'zext-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PYZEXT
      - name: Isolate strided-load and string-inlining performance
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          cat > results/research/strided-off-compiler <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          export CCC_NO_STRIDED_REDUCE=1
          exec "$(dirname -- "$0")/../../target/fastbuild/lccc" "$@"
          SH
          cat > results/research/string-inline-off-compiler <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          export CCC_INLINE_SKIP=two_way_short_needle
          exec "$(dirname -- "$0")/../../target/fastbuild/lccc" "$@"
          SH
          chmod +x results/research/strided-off-compiler results/research/string-inline-off-compiler
          for control in strided string_inline; do
            if [[ "$control" == strided ]]; then
              case_name=byte_load_reassembly
              wrapper=strided-off-compiler
            else
              case_name=glibc_strstr
              wrapper=string-inline-off-compiler
            fi
            if [[ "$RESEARCH_CASES" != all && ",$RESEARCH_CASES," != *,"$case_name",* ]]; then
              continue
            fi
            for profile in portable native; do
              flags="-O2 -std=gnu17"
              if [[ "$profile" == native ]]; then flags+=" -march=native"; fi
              python3 scripts/benchmark_native_batched.py \
                --compiler lccc=target/fastbuild/lccc \
                --compiler "disabled=$GITHUB_WORKSPACE/results/research/$wrapper" \
                --compiler gcc=gcc-16 --reference disabled \
                --gcc gcc-16 --flags="$flags" --cpu auto \
                --only "$case_name" --rounds "$RESEARCH_ROUNDS" --seconds .2 \
                --out "results/research/$profile-$control-ab"
            done
            python3 scripts/callgrind_corpus.py \
              --mine target/fastbuild/lccc --ref "$GITHUB_WORKSPACE/results/research/$wrapper" \
              --gcc-include-command gcc-16 --target-flags=-march=x86-64-v3 \
              --only "$case_name" --out "results/research/callgrind-$control-ab"
          done
      - name: Calibrated short-kernel entry timing without exec startup
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          for profile in portable native; do
            flags="-O2 -std=gnu17"
            if [[ "$profile" == native ]]; then flags+=" -march=native"; fi
            python3 scripts/benchmark_native_batched.py \
              --compiler lccc=target/fastbuild/lccc \
              --compiler "before=$RUNNER_TEMP/research-main-target/fastbuild/lccc" \
              --compiler gcc=gcc-16 --compiler "clang=$CLANG" --reference before \
              --gcc gcc-16 --flags="$flags" --cpu auto \
              --only byte_load_reassembly,matmul,zstd_count \
              --rounds "$RESEARCH_ROUNDS" --seconds .2 \
              --out "results/research/$profile-batched"
          done
      - name: Publish startup-excluded results and alias disclosure
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          for profile in ('portable', 'native'):
              path = Path('results/research') / (profile + '-batched') / 'results.json'
              if path.exists():
                  report = json.loads(path.read_text())
                  for row in report['rows']:
                      text = json.dumps({'profile': profile, 'name': row['name'],
                                         'complete': report['complete'],
                                         'measured_as': row['measured_as'],
                                         'comparisons': row['comparisons']}, separators=(',', ':'))
                      # Samples remain in the artifact; do not overflow annotation limits.
                      value = json.loads(text)
                      for result in value['comparisons'].values():
                          result.pop('paired_ratios', None)
                      text = json.dumps(value, separators=(',', ':'))
                      text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::notice title=Startup-excluded CPU runtime::' + text)
          PYCODE
      - name: Correctness-gated bounded Callgrind main/candidate A-B
        timeout-minutes: 20
        run: |
          if [[ "$RESEARCH_CASES" == all ]]; then RESEARCH_CASES=""; fi
          python3 scripts/callgrind_corpus.py \
            --mine target/fastbuild/lccc \
            --ref "$RUNNER_TEMP/research-main-target/fastbuild/lccc" \
            --gcc-include-command gcc-16 --target-flags="" \
            --only "$RESEARCH_CASES" --out results/research/callgrind-main
      - name: Supplementary Callgrind against identified native GCC
        timeout-minutes: 20
        # Identified native GCC16; this is not measured execution of CE binaries.
        run: |
          if [[ "$RESEARCH_CASES" == all ]]; then RESEARCH_CASES=""; fi
          python3 scripts/callgrind_corpus.py \
            --mine target/fastbuild/lccc --ref gcc-16 --gcc-include-command gcc-16 --target-flags="" \
            --only "$RESEARCH_CASES" --out results/research/callgrind-gcc
      - name: Publish bounded measurement verdicts and full-report hashes
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path('results/research')
          root.mkdir(parents=True, exist_ok=True)
          summary = {'metric': 'bounded simulated Ir; NOT native cycles or universal superiority',
                     'head': (root / 'candidate.sha').read_text().strip() if (root / 'candidate.sha').exists() else None,
                     'baseline': (root / 'baseline.sha').read_text().strip() if (root / 'baseline.sha').exists() else None,
                     'artifact': 'compiler-research', 'callgrind': {}}
          from tests.benchmark.run_benchmarks import BENCHMARKS
          selected = (set(os.environ['RESEARCH_CASES'].split(','))
                      if os.environ['RESEARCH_CASES'] not in ('', 'all') else {b.name for b in BENCHMARKS})
          for arm in ('main', 'gcc'):
              path = root / f'callgrind-{arm}' / 'index.json'
              if not path.exists():
                  summary['callgrind'][arm] = {'available': False}
                  continue
              raw = path.read_bytes()
              data = json.loads(raw)
              complete = data['complete'] and not data['failures'] and set(data['results']) == selected
              summary['callgrind'][arm] = {
                  'complete': complete,
                  'report_sha256': hashlib.sha256(raw).hexdigest(),
                  'ratios': {name: row['metrics']['ir_ratio'] for name, row in data['results'].items()},
                  'failed_cases': [row['name'] for row in data['failures']],
              }
          from scripts.publish_cpu_runtime_evidence import (control_digest,
                                                              optimization_controls)
          controls = optimization_controls(root, selected)
          summary['optimization_controls'] = controls
          # The complete records stay in the files above; the notice carries a
          # compact digest so a control payload can never crowd out the verdict.
          notice = dict(summary, optimization_controls=control_digest(controls))
          text = json.dumps(notice, separators=(',', ':'))
          assert len(text.encode()) <= 3900, 'checks API annotation budget exceeded'
          escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::notice title=Compiler research evidence::{escaped}')
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('```json\n' + json.dumps(summary, indent=2) + '\n```\n')
          PY
      # Bounded comparison windows fit both per-annotation and whole-job
      # checks limits, after the timing and Callgrind summaries.
      - name: Publish portable word-saturation assembly
        if: always()
        run: python3 scripts/publish_cpu_runtime_evidence.py results/research --assembly-profile portable --assembly-cases zlib_ng_slide_hash
      - name: Publish native word-saturation assembly
        if: always()
        run: python3 scripts/publish_cpu_runtime_evidence.py results/research --assembly-profile native --assembly-cases zlib_ng_slide_hash
      - name: Publish portable floating-point assembly
        if: always()
        run: python3 scripts/publish_cpu_runtime_evidence.py results/research --assembly-profile portable --assembly-cases fp64_product_map,fp32_product_map
      - name: Publish native floating-point assembly
        if: always()
        run: python3 scripts/publish_cpu_runtime_evidence.py results/research --assembly-profile native --assembly-cases fp64_product_map,fp32_product_map
      - name: Publish portable list, SQLite and string-search assembly
        if: always()
        run: python3 scripts/publish_cpu_runtime_evidence.py results/research --assembly-profile portable --assembly-cases linux_list_sort,sqlite_vdbe_serial,glibc_strstr
      - name: Publish native list, SQLite and string-search assembly
        if: always()
        run: python3 scripts/publish_cpu_runtime_evidence.py results/research --assembly-profile native --assembly-cases linux_list_sort,sqlite_vdbe_serial,glibc_strstr
      - name: Publish portable byte and arithmetic assembly
        if: always()
        run: python3 scripts/publish_cpu_runtime_evidence.py results/research --assembly-profile portable --assembly-cases byte_load_reassembly,zlib_ng_compare256,arith_loop,nbody
      - name: Publish native byte and arithmetic assembly
        if: always()
        run: python3 scripts/publish_cpu_runtime_evidence.py results/research --assembly-profile native --assembly-cases byte_load_reassembly,zlib_ng_compare256,arith_loop,nbody
      - name: Retain all identities, flags, counters, assembly and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compiler-research
          path: results/research/
          if-no-files-found: warn

  patched-llvm-slp:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.patched_llvm_slp }}
    name: Pinned LLVM SLP PR and exact-base comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Cache the provisioned oracle toolchain
        uses: actions/cache@v6
        with:
          path: ~/.cache/lccc-toolchain
          key: lccc-toolchain-v1-${{ runner.os }}-${{ hashFiles('scripts/ci_install_gcc16.sh', 'scripts/ci_toolchain_bundle.sh', 'scripts/ci_provision_toolchain.sh') }}
      - name: Provision oracle toolchain (cached bundle, else apt)
        run: bash scripts/ci_provision_toolchain.sh --multilib
      - name: Verify Ninja build dependency
        run: ninja --version
      - name: Enable bounded swap for source compilation
        run: bash scripts/ci_enable_swap.sh
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/lccc/gcc-oracle/16.2
            ~/.cache/lccc/clang-oracle/23.1.4
          key: llvm-slp-companions-${{ runner.os }}-${{ hashFiles('scripts/ci_install_gcc_oracle.sh', 'scripts/ci_install_clang_oracle.sh') }}
      - name: Install exact GCC 16.2
        run: bash scripts/ci_install_gcc_oracle.sh --version 16.2
      - name: Install exact Clang 23.1.4
        run: bash scripts/ci_install_clang_oracle.sh --version 23.1.4
      - name: Select modern unversioned C and C++ commands
        run: |
          mkdir -p "$RUNNER_TEMP/modern-oracles"
          for name in gcc cc; do ln -s "$(command -v gcc-16)" "$RUNNER_TEMP/modern-oracles/$name"; done
          for name in g++ c++; do ln -s "$(command -v g++-16)" "$RUNNER_TEMP/modern-oracles/$name"; done
          ln -s "$CLANG" "$RUNNER_TEMP/modern-oracles/clang"
          ln -s "${CLANG%/clang}/clang++" "$RUNNER_TEMP/modern-oracles/clang++"
          echo "$RUNNER_TEMP/modern-oracles" >> "$GITHUB_PATH"
      - name: Verify the lane's oracle toolchain
        run: bash scripts/ci_verify_oracles.sh --gcc-version 16.2 --clang-version 23.1.4
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/llvm-slp-oracles
          key: llvm-slp-a1d36a0-a8eea17-${{ runner.os }}-${{ hashFiles('scripts/ci_build_llvm_slp_oracles.sh') }}
      - name: Build hash-pinned LLVM base and PR head, serially
        run: bash scripts/ci_build_llvm_slp_oracles.sh "$RUNNER_TEMP/llvm-slp-oracles" "$RUNNER_TEMP/llvm-slp-build"
      - name: Build current LCCC with fastbuild and bounded jobs
        env:
          CARGO_PROFILE_FASTBUILD_DEBUG: '0'
        run: bash scripts/build_lccc_fast.sh
      - name: Compare defaults and explicit non-power-of-two SLP on one host
        run: |
          mkdir -p results/llvm-slp
          python3 tests/simd/benchmark_lightpixel.py \
            --compiler "lccc=$PWD/target/fastbuild/lccc" \
            --compiler "gcc16=$(command -v gcc-16)" \
            --compiler "clang23=$CLANG" \
            --compiler "llvm-base=$RUNNER_TEMP/llvm-slp-oracles/clang-base -resource-dir=$RUNNER_TEMP/llvm-slp-oracles/resource" \
            --compiler "llvm-pr=$RUNNER_TEMP/llvm-slp-oracles/clang-patched -resource-dir=$RUNNER_TEMP/llvm-slp-oracles/resource" \
            --compiler "llvm-base-npot=$RUNNER_TEMP/llvm-slp-oracles/clang-base -resource-dir=$RUNNER_TEMP/llvm-slp-oracles/resource -mllvm -slp-vectorize-non-power-of-2" \
            --compiler "llvm-pr-npot=$RUNNER_TEMP/llvm-slp-oracles/clang-patched -resource-dir=$RUNNER_TEMP/llvm-slp-oracles/resource -mllvm -slp-vectorize-non-power-of-2" \
            --rounds 12 --json results/llvm-slp/timings.json
          cp "$RUNNER_TEMP/llvm-slp-oracles/"{build.json,SHA256SUMS,version-base.txt,version-patched.txt} results/llvm-slp/
      - name: Retain timings, exact build identities and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: llvm-slp-pr227303-comparison
          path: |
            results/llvm-slp/
            ${{ runner.temp }}/llvm-slp-oracles/*.log
            ${{ runner.temp }}/llvm-slp-oracles/build.json
          if-no-files-found: warn
