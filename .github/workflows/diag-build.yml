name: Diag build (temporary)
on:
  push:
    branches: [arena/24fe00ee-lccc]
jobs:
  b:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check with warnings denied
        run: |
          report() {
            python3 - "$1" "$2" <<'PY'
          import sys
          title, path = sys.argv[1], sys.argv[2]
          text = open(path, errors="replace").read()
          lines = [l for l in text.splitlines() if "error" in l or "warning" in l]
          body = "\n".join(lines[:40])[-3000:]
          enc = body.replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D")
          print(f"::error title={title}::{enc}")
          PY
          }
          RUSTFLAGS="-D warnings" cargo check --profile fastbuild --locked --all-targets > /tmp/chk.log 2>&1 || { report CHECK-FAIL /tmp/chk.log; exit 1; }
          cargo clippy --profile fastbuild --locked --all-targets -- -D warnings > /tmp/clip.log 2>&1 || { report CLIPPY-FAIL /tmp/clip.log; exit 1; }
          echo "::notice title=CHECK::clean"
