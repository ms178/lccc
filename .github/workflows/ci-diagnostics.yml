name: CI diagnostic evidence

# Label-only transport must not restart/cancel the kernel or replace its check
# with a skipped job. No build/test jobs live in this workflow.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  diagnostic-transport:
    if: github.event.label.name == 'ci-diagnostic-transport' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Export existing evidence without changing refs or check results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/export_ci_diagnostics.py
