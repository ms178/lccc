name: Audit diagnostics (temporary)

# Temporary diagnostic harness for PR #817: the Test Suite job in ci.yml is
# red and its first failing step cannot be identified from outside the
# runner. This workflow replays every pre-"Run tests" gate of that job in
# sequence WITHOUT stopping at the first failure, and reports each verdict
# as a check annotation (readable via the GitHub API). It exists only on
# this branch and must be deleted before the PR merges.

on:
  push:
    branches: [arena/24fe00ee-lccc]

permissions:
  contents: read

jobs:
  diag:
    name: Audit diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install i686 C runtime and development files
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib g++-multilib libc6-dev-i386

      - name: Install differential linker oracles
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold lld

      - name: Install a C23-capable GCC oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-14

      - name: Install the GCC 16 verdict oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-16 gcc-16-multilib lib32gcc-16-dev
          gcc-16 --version | head -1

      - name: No merge conflict markers
        run: python3 scripts/check_no_conflict_markers.py

      - name: Build
        run: ./scripts/build_lccc_fast.sh

      - name: Replay pre-Run-tests gates, reporting every verdict
        run: |
          fail=0
          gate() {
            name="$1"; shift
            echo "::group::GATE $name"
            if timeout 600 "$@" >"/tmp/gate-$name.log" 2>&1; then
              echo "PASS $name"
            else
              rc=$?
              fail=1
              tail=$(tail -c 1500 "/tmp/gate-$name.log" | tr '\n\r%' '   ' | cut -c1-900)
              echo "::error title=DIAG-GATE-FAIL::$name rc=$rc tail: $tail"
              echo "FAIL $name rc=$rc"
            fi
            echo "::endgroup::"
          }
          export CCC=target/fastbuild/lccc
          gate rec2iter            env CCC=target/fastbuild/lccc bash tests/regression/check_rec2iter.sh
          gate fp-contract         env CCC=target/fastbuild/lccc bash tests/regression/check_fp_contract_parity.sh
          gate dash-o-stdout       env CCC=target/fastbuild/lccc bash tests/regression/check_dash_o_stdout.sh
          gate cpu-supports        env CCC=target/fastbuild/lccc bash tests/regression/check_cpu_supports_runtime.sh
          gate got-slot            env CCC=target/fastbuild/lccc bash tests/regression/check_got_slot_local_addend.sh
          gate temp-symlink        env CCC=target/fastbuild/lccc bash tests/regression/check_temp_symlink.sh
          gate i386-policy         bash tests/regression/check_i386_run_policy.sh
          gate a9987               env LCCC_REQUIRE_I686=1 CCC=target/fastbuild/lccc bash tests/regression/check_a9987_salvage.sh
          gate memory-contracts    env CCC=target/fastbuild/lccc bash tests/regression/check_memory_value_contracts.sh
          gate audit-loop          env CCC=target/fastbuild/lccc bash tests/regression/check_audit_loop_contracts.sh
          gate ivsr-domains        env CCC=target/fastbuild/lccc bash tests/regression/check_ivsr_domains.sh
          gate vector-abi          env CCC=target/fastbuild/lccc bash tests/regression/check_vector_abi_boundary.sh
          gate vector-abi-wide     env CCC=target/fastbuild/lccc bash tests/regression/check_vector_abi_wide.sh
          gate compat-suite        env CCC=target/fastbuild/lccc bash tests/regression/check_compat_suite.sh
          gate ivsr-reproducers    env CCC=target/fastbuild/lccc bash tests/regression/check_ivsr_reproducers.sh
          gate o-stdout            env CCC=target/fastbuild/lccc bash tests/regression/check_o_stdout.sh
          gate repro-replay        bash -c 'python3 scripts/check_repro_replay.py --self-test && env CCC=target/fastbuild/lccc python3 scripts/check_repro_replay.py'
          gate shuffle-diag        env CCC=target/fastbuild/lccc bash tests/regression/check_shuffle_diagnostics.sh
          gate cross-target-trap   env CCC=target/fastbuild/lccc CCC_ARM=target/fastbuild/lccc-arm CCC_RISCV=target/fastbuild/lccc-riscv CCC_I686=target/fastbuild/lccc-i686 bash tests/regression/check_cross_target_intrinsic_trap.sh
          gate intrinsic-gate      env CCC=target/fastbuild/lccc bash tests/regression/check_intrinsic_feature_gate.sh
          gate diagnostic-pos      env CCC=target/fastbuild/lccc bash tests/regression/check_diagnostic_positions.sh
          gate static-local        env CCC=target/fastbuild/lccc GCC=gcc-16 bash tests/regression/check_static_local_init.sh
          gate designator          env CCC=target/fastbuild/lccc GCC=gcc-16 bash tests/regression/check_designator_init.sh
          gate file-scope          env CCC=target/fastbuild/lccc GCC=gcc-16 bash tests/regression/check_file_scope_init.sh
          gate typedef-volatile    env CCC=target/fastbuild/lccc GCC=gcc-16 bash tests/regression/check_typedef_volatile_codegen.sh
          gate seg-brace           env CCC=target/fastbuild/lccc GCC=gcc-16 bash tests/regression/check_seg_init_brace_elision.sh
          gate volatile-member     env CCC=target/fastbuild/lccc GCC=gcc-16 bash tests/regression/check_volatile_member_codegen.sh
          gate const-volatile      env CCC=target/fastbuild/lccc GCC=gcc-16 bash tests/regression/check_const_volatile_objects.sh
          gate seg-typedef         env CCC=target/fastbuild/lccc bash tests/regression/check_seg_typedef_codegen.sh
          gate seg-conversion      env CCC=target/fastbuild/lccc bash tests/regression/check_seg_conversion_parity.sh
          echo "::notice title=DIAG-SUMMARY::fail flag=$fail (see DIAG-GATE-FAIL annotations)"
          exit $fail

  diag2:
    name: Audit diagnostics (late steps)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install i686 C runtime and development files
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib g++-multilib libc6-dev-i386

      - name: Install differential linker oracles
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold lld

      - name: Install a C23-capable GCC oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-14

      - name: Install the GCC 16 verdict oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common python3-yaml
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-16 gcc-16-multilib lib32gcc-16-dev

      - name: Build
        run: ./scripts/build_lccc_fast.sh

      - name: Replay Test Suite steps 55-150, reporting every verdict
        run: python3 scripts/audit_diag_replay.py 55 150

  diag3:
    name: Audit diagnostics (steps 95 and 111)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install i686 C runtime and development files
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib g++-multilib libc6-dev-i386

      - name: Install differential linker oracles
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold lld

      - name: Install a C23-capable GCC oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-14

      - name: Install the GCC 16 verdict oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common python3-yaml
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-16 gcc-16-multilib lib32gcc-16-dev

      - name: Build
        run: ./scripts/build_lccc_fast.sh

      - name: Replay steps 95 and 111
        run: |
          rc=0
          python3 scripts/audit_diag_replay.py 95 95 || rc=1
          python3 scripts/audit_diag_replay.py 111 111 || rc=1
          exit $rc
