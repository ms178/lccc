# Publishes the Clang 23.1.3 oracle (the exact subset
# scripts/ci_install_clang_oracle.sh extracts: driver + resource headers) as
# an orphan tag `harness-cache-4`, chunked below GitHub's 100 MiB file limit
# like the other `harness-cache-*` tags, so a developer sandbox whose egress
# is limited to github.com can run the Clang-oracle gates locally.
# Idempotent: a second run finds the tag and does nothing.
name: Clang oracle cache
on:
  push:
    branches: [arena/9bf72f50-lccc]
permissions:
  contents: write
jobs:
  publish:
    name: Publish harness-cache-4 (Clang 23.1.3 oracle)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - name: Skip when the tag already exists
      id: probe
      run: |
        set -euo pipefail
        if git ls-remote --exit-code --tags origin refs/tags/harness-cache-4 >/dev/null 2>&1; then
          echo "present=1" >> "$GITHUB_OUTPUT"
        else
          echo "present=0" >> "$GITHUB_OUTPUT"
        fi
    - name: Install the Clang 23.1.3 oracle
      if: steps.probe.outputs.present == '0'
      run: bash scripts/ci_install_clang_oracle.sh --prefix "$RUNNER_TEMP/clang-23.1.3"
    - name: Pack, chunk and publish the orphan tag
      if: steps.probe.outputs.present == '0'
      run: |
        set -euo pipefail
        work=$RUNNER_TEMP/cache4
        mkdir -p "$work"
        tar -C "$RUNNER_TEMP" -cf - clang-23.1.3 | xz -T0 -6 > "$work/clang-23.1.3-linux-x64.tar.xz"
        ( cd "$work" && split -b 90m -d -a 2 clang-23.1.3-linux-x64.tar.xz clang-23.1.3-linux-x64.tar.xz.part \
          && rm clang-23.1.3-linux-x64.tar.xz && sha256sum ./* > MANIFEST.sha256 && ls -la )
        export GIT_DIR=$work/.git GIT_WORK_TREE=$work
        git init -q
        git -c user.name=cache -c user.email=cache@local add -A
        tree=$(git write-tree)
        commit=$(printf 'Clang 23.1.3 oracle (driver + resource headers), %s\n' "$(date -u +%FT%TZ)" |
          git -c user.name=cache -c user.email=cache@local commit-tree "$tree")
        git update-ref refs/tags/harness-cache-4 "$commit"
        git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/tags/harness-cache-4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
